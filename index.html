<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyra</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#070818;--bg2:#0d0f26;--glass:rgba(22,24,52,.62);--glass2:rgba(34,37,72,.7);
  --line:rgba(160,150,255,.16);--line2:rgba(160,150,255,.3);
  --text:#eceafd;--sub:#9b99c4;--dim:#6c6a96;
  --acc:#9d8cff;--acc2:#ff7ac6;--acc3:#6fd6ff;--gold:#ffd166;--danger:#ff7b8a;
  --grad:linear-gradient(120deg,#9d8cff 0%,#ff7ac6 55%,#ffb38a 100%);
  --r:16px;--shadow:0 20px 50px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  background:var(--bg);padding-bottom:130px;overflow-x:hidden}
/* 밤하늘 배경 */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(1200px 600px at 85% -10%,rgba(157,140,255,.22),transparent 60%),
   radial-gradient(900px 500px at -10% 30%,rgba(255,122,198,.12),transparent 60%),
   radial-gradient(800px 600px at 60% 120%,rgba(111,214,255,.10),transparent 60%),
   linear-gradient(180deg,#070818,#0a0b22 60%,#070818)}
.sky::before,.sky::after{content:"";position:absolute;inset:-50%;background-repeat:repeat;opacity:.55;
  background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfc8ff,transparent),
   radial-gradient(1.5px 1.5px at 200px 150px,#fff,transparent),radial-gradient(1px 1px at 280px 40px,#ffd9f0,transparent),
   radial-gradient(1px 1px at 330px 220px,#fff,transparent),radial-gradient(1.5px 1.5px at 60px 260px,#bfe9ff,transparent);
  background-size:360px 300px;animation:drift 160s linear infinite}
.sky::after{background-size:520px 440px;opacity:.35;animation-duration:260s;animation-direction:reverse}
@keyframes drift{to{transform:translate(180px,90px)}}

button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--glass2);color:var(--text);border-radius:12px;padding:8px 14px;transition:.18s}
button:hover{border-color:var(--line2);background:rgba(50,52,100,.8)}
button:active{transform:scale(.97)}
button.primary{background:var(--grad);border:none;color:#1a1030;font-weight:800;box-shadow:0 8px 24px -10px rgba(255,122,198,.8)}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{font:inherit;background:rgba(8,9,26,.6);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;transition:.18s;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(157,140,255,.18)}
textarea{resize:vertical;min-height:100px;line-height:1.6}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#2a2b55;border-radius:10px}

/* ===== 오픈 이펙트 ===== */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 45%,#16124a 0%,#070818 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .8s,transform .8s}
#intro.out{opacity:0;transform:scale(1.06);pointer-events:none}
#introStars{position:absolute;inset:0}
.intro-stage{position:relative;width:260px;height:260px}
.intro-vinyl{position:absolute;inset:30px;border-radius:50%;
  background:repeating-radial-gradient(circle,#111 0 2px,#1b1b24 2px 4px);box-shadow:0 0 60px rgba(157,140,255,.35),inset 0 0 0 2px #000;
  animation:vinylIn 1s cubic-bezier(.2,.9,.3,1.2) both,spin 2.4s linear infinite}
.intro-vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 40deg,rgba(255,255,255,.12) 60deg,transparent 80deg,transparent 220deg,rgba(255,255,255,.08) 240deg,transparent 260deg)}
.intro-vinyl::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--grad);box-shadow:inset 0 0 0 6px rgba(0,0,0,.25)}
@keyframes vinylIn{from{transform:scale(.2) rotate(-90deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{rotate:360deg}}
.intro-const{position:absolute;inset:0;overflow:visible}
.intro-const line{stroke:#cfc6ff;stroke-width:1.2;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .5s ease forwards;filter:drop-shadow(0 0 4px #9d8cff)}
.intro-const circle{fill:#fff;opacity:0;animation:pop .4s ease forwards;filter:drop-shadow(0 0 6px #fff)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;r:0}60%{opacity:1;r:5}100%{opacity:1}}
.intro-title{margin-top:26px;font-size:64px;font-weight:900;letter-spacing:.12em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  display:flex;gap:2px;position:relative}
.intro-title span{opacity:0;transform:translateY(20px);animation:up .6s ease forwards}
@keyframes up{to{opacity:1;transform:none}}
.intro-sub{color:var(--sub);letter-spacing:.3em;font-size:13px;opacity:0;animation:up .8s ease 1.9s forwards;position:relative}
.intro-skip{position:absolute;bottom:28px;color:var(--dim);font-size:12px;opacity:0;animation:up .6s ease 1.2s forwards}

/* ===== 헤더 ===== */
header{position:sticky;top:0;z-index:30;display:flex;gap:14px;align-items:center;padding:12px 26px;flex-wrap:wrap;
  background:rgba(7,8,24,.7);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand-disc{width:34px;height:34px;border-radius:50%;background:repeating-radial-gradient(circle,#15151c 0 1.5px,#22222c 1.5px 3px);position:relative;box-shadow:0 0 18px rgba(157,140,255,.5)}
.brand-disc::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--grad)}
body.playing .brand-disc{animation:spin 3s linear infinite}
.logo{font-size:24px;font-weight:900;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mode{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--sub);background:var(--glass)}
.mode.online{color:#6ff0b6;border-color:rgba(111,240,182,.35)}
.mode.online::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#6ff0b6;margin-right:6px;vertical-align:middle;box-shadow:0 0 8px #6ff0b6;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.3}}
.searchbox{flex:1;min-width:200px;max-width:460px;position:relative}
.searchbox input{padding-left:38px;border-radius:99px;background:rgba(20,22,50,.7)}
.searchbox::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);color:var(--sub);font-size:18px}
.spacer{flex:1}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#120d26;flex:none}
.userbtn{display:flex;align-items:center;gap:8px;border-radius:99px;padding:4px 14px 4px 4px}

main{max-width:1280px;margin:0 auto;padding:26px}
/* 상단 소개 */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.hero h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.01em}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:6px 0 0;color:var(--sub)}
.stats{display:flex;gap:10px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-align:center;min-width:84px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}

.tabs{display:inline-flex;gap:4px;padding:5px;border-radius:99px;background:var(--glass);border:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:none;background:transparent;border-radius:99px;padding:8px 18px;color:var(--sub);font-weight:700}
.tabs button.on{background:var(--grad);color:#1a1030}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(20,22,50,.5);color:var(--sub)}
.chip.on{background:rgba(255,122,198,.18);border-color:var(--acc2);color:#ffd0ea}
.filters select{width:auto;border-radius:99px;padding:8px 14px}

/* ===== 카드 (LP 재킷) ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 22px}
.card{cursor:pointer;position:relative;animation:cardIn .5s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}}
.jw{position:relative;aspect-ratio:1;margin-right:14%}
.vinyl{position:absolute;top:4%;bottom:4%;right:-14%;aspect-ratio:1;border-radius:50%;
  background:repeating-radial-gradient(circle,#0e0e14 0 2px,#1d1d27 2px 3.5px);box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent 0 30deg,rgba(255,255,255,.1) 50deg,transparent 70deg,transparent 210deg,rgba(255,255,255,.07) 230deg,transparent 250deg)}
.vinyl .lbl{position:absolute;inset:33%;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 4px rgba(0,0,0,.35)}
.vinyl .lbl::after{content:"";position:absolute;inset:44%;border-radius:50%;background:#070818}
.card:hover .vinyl{transform:translateX(18%) rotate(40deg)}
.card.playing .vinyl{transform:translateX(26%);animation:spin 2.6s linear infinite}
.jacket{position:absolute;inset:0;border-radius:10px;overflow:hidden;box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.06);transition:transform .35s}
.card:hover .jacket{transform:translateY(-4px)}
.cover{width:100%;height:100%;object-fit:cover;display:block}
.cover.yt{transform:scale(1.36)}
.gencover{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px;position:relative;overflow:hidden}
.gencover::before{content:"";position:absolute;width:140%;aspect-ratio:1;border-radius:50%;right:-60%;bottom:-70%;background:rgba(255,255,255,.12)}
.gencover .gi{font-size:30px;opacity:.9;align-self:flex-end}
.gencover .gt{font-weight:900;font-size:19px;line-height:1.2;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;position:relative}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;letter-spacing:.06em;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:3px 8px;border-radius:99px}
.badge.youtube{color:#ff8a8a}.badge.mp3{color:#9ee7ff}.badge.mp4{color:#ffd39a}
.rank{position:absolute;bottom:8px;left:10px;font-size:40px;font-weight:900;line-height:1;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.6);font-style:italic}
.playbtn{position:absolute;bottom:10px;right:10px;width:44px;height:44px;border-radius:50%;padding:0;border:none;background:var(--grad);color:#1a1030;font-size:16px;
  opacity:0;transform:translateY(8px) scale(.9);transition:.25s;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.card:hover .playbtn,.card.playing .playbtn{opacity:1;transform:none}
.info{padding:14px 2px 0}
.info .t{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .a{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.meta{display:flex;gap:10px;font-size:13px;color:var(--sub);margin-top:8px;align-items:center}
.meta .num{color:var(--gold);font-weight:800}
.by{font-size:12px;color:var(--sub);margin-top:8px;display:flex;align-items:center;gap:6px}
.by .avatar{width:20px;height:20px;font-size:10px}
.oneline{font-size:13px;margin-top:10px;color:#dcd8ff;background:rgba(157,140,255,.1);border-left:3px solid var(--acc);border-radius:4px 10px 10px 4px;padding:7px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;color:var(--acc3);background:rgba(111,214,255,.08);padding:2px 8px;border-radius:99px}
.stars{position:relative;display:inline-block;letter-spacing:1px;line-height:1}
.stars .bg{color:#33345e}
.stars .fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold);text-shadow:0 0 8px rgba(255,209,102,.4)}
.empty{color:var(--sub);text-align:center;padding:70px 0}
.empty .ei{font-size:54px;margin-bottom:10px;opacity:.7}
.skel{border-radius:10px;aspect-ratio:1;margin-right:14%;background:linear-gradient(100deg,#15163a 30%,#23245a 50%,#15163a 70%);background-size:300% 100%;animation:shimmer 1.4s infinite}
.skel-l{height:14px;border-radius:6px;margin-top:12px;width:70%;background:#17183d}
@keyframes shimmer{to{background-position:-150% 0}}

/* ===== 모달 ===== */
.modal{position:fixed;inset:0;background:rgba(3,3,12,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:50px 14px;overflow:auto;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.box{background:linear-gradient(180deg,rgba(26,28,62,.96),rgba(14,15,38,.97));border:1px solid var(--line2);border-radius:22px;padding:26px;width:100%;max-width:470px;position:relative;box-shadow:0 40px 100px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.03) inset;animation:pop2 .35s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop2{from{opacity:0;transform:translateY(18px) scale(.97)}}
.box.wide{max-width:1020px;padding:0;overflow:hidden}
.box h2{margin:0 0 6px;font-size:22px}
.close{position:absolute;top:14px;right:14px;width:36px;height:36px;padding:0;border-radius:50%;font-size:16px;z-index:3;background:rgba(0,0,0,.35)}
.auth-head{text-align:center;margin-bottom:10px}
.auth-head .brand-disc{width:56px;height:56px;margin:0 auto 10px;animation:spin 4s linear infinite}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors span{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.colors span:hover{transform:scale(1.1)}
.colors span.on{border-color:#fff;box-shadow:0 0 14px currentColor}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(8,9,26,.6);border:1px solid var(--line);margin:8px 0}
.seg button{flex:1;border:none;background:transparent;border-radius:10px;color:var(--sub);font-weight:700}
.seg button.on{background:var(--grad);color:#1a1030}
.err{color:var(--danger);font-size:13px;min-height:20px;margin-top:10px}
.hint{font-size:12px;color:var(--sub)}
.ytprev{margin-top:10px;width:100%;max-width:260px;border-radius:12px;box-shadow:var(--shadow)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:18px;text-align:center;color:var(--sub);background:rgba(8,9,26,.4)}
.drop input{border:none;background:transparent;padding:6px 0}

/* ===== 상세 ===== */
.dhero{position:relative;padding:34px;overflow:hidden}
.dhero-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.5) brightness(.55);transform:scale(1.2)}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,15,38,.1),rgba(14,15,38,.97))}
.dhead{position:relative;z-index:1;display:flex;gap:34px;flex-wrap:wrap;align-items:flex-end}
.dhead .card{cursor:default;width:230px;flex:none;animation:none}
.dhead .card .vinyl{transform:translateX(22%)}
.dhead .card.playing .vinyl{transform:translateX(30%)}
.dhead .dt{flex:1;min-width:240px}
.dt .kind{font-size:12px;letter-spacing:.2em;color:var(--sub);font-weight:700}
.dt h2{font-size:34px;font-weight:900;margin:6px 0 4px;line-height:1.15}
.dt .art{color:#d6d3f5;font-size:17px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions a{text-decoration:none}
.likebtn.on{border-color:var(--acc2);background:rgba(255,122,198,.15)}
.note{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;white-space:pre-wrap;font-size:14px;line-height:1.6}
.dbody{padding:4px 34px 34px}
.cols{display:grid;grid-template-columns:310px 1fr;gap:24px}
@media(max-width:780px){.cols{grid-template-columns:1fr}.dhero,.dbody{padding-left:20px;padding-right:20px}.dt h2{font-size:26px}}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px}
.scorebox{text-align:center;position:sticky;top:10px}
.big{font-size:52px;font-weight:900;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;margin:26px 0 10px}
.sec-title .cnt{font-size:13px;color:var(--sub);font-weight:600}
.review{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:14px;margin-bottom:10px;animation:cardIn .4s ease both}
.review.mine{border-color:rgba(157,140,255,.5)}
.review .mini{flex:none}
.review .rb{flex:1;min-width:0}
.review .ol{font-weight:800;font-size:16px;margin:6px 0}
.review .body{font-size:14px;white-space:pre-wrap;color:#cfcbef;line-height:1.65}
.review .body.clip{max-height:4.9em;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent)}
.rmeta{font-size:12px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rmeta .avatar{width:22px;height:22px;font-size:10px}
.scores{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.scores span{font-size:11px;background:rgba(255,255,255,.05);padding:2px 8px;border-radius:99px;color:var(--sub)}
.scores b{color:var(--gold)}
.linkbtn{background:none;border:none;color:var(--acc);padding:0;font-size:12px;font-weight:700}
.form{margin-top:12px}
.starin{font-size:36px;cursor:pointer;user-select:none;display:inline-block;transition:transform .15s}
.starin:hover{transform:scale(1.04)}
.starval{font-size:22px;font-weight:900;color:var(--gold);margin-left:8px;vertical-align:middle}
.slider{display:grid;grid-template-columns:104px 1fr 30px;gap:10px;align-items:center;font-size:13px;margin:8px 0;color:#d6d3f5}
.slider b{color:var(--gold);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;padding:0;border:none;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2)) 0/var(--p,50%) 100% no-repeat,#24264f}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(157,140,255,.35);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:none}
.counter{font-size:11px;color:var(--dim);text-align:right;margin-top:4px}

/* ===== 플레이어 ===== */
#player{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(1100px,calc(100% - 24px));z-index:50;
  background:rgba(14,15,38,.82);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:22px;
  display:flex;gap:14px;align-items:center;padding:10px 14px;box-shadow:0 20px 60px -10px rgba(0,0,0,.8);animation:slideUp .4s cubic-bezier(.2,.9,.3,1.1)}
@keyframes slideUp{from{transform:translate(-50%,120%)}}
.pdisc{width:52px;height:52px;border-radius:50%;flex:none;position:relative;background:repeating-radial-gradient(circle,#0e0e14 0 1.5px,#1d1d27 1.5px 3px);animation:spin 3s linear infinite;box-shadow:0 0 20px rgba(157,140,255,.4)}
.pdisc .lbl{position:absolute;inset:30%;border-radius:50%;background-size:cover;background-position:center}
#player.bigmode{flex-wrap:wrap}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.pinfo span{font-size:12px;color:var(--sub)}
.pinfo a{color:var(--acc)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px;vertical-align:-1px}

function radar(vals, size=240, labels=true){

  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};

  const pad=labels?34:0;let s=`<svg width="${size+pad*2}" height="${size}" viewBox="${-pad} 0 ${size+pad*2} ${size}" style="max-width:100%">`;
  for(const lv of [2,4,6,8,10]) s+=`<polygon points="${poly(R*lv/10)}" fill="none" stroke="rgba(160,150,255,.18)" stroke-width="1"/>`;
  for(let i=0;i<5;i++){const [x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(160,150,255,.18)"/>`}
  if(vals){
    const dp=vals.map((v,i)=>pt(i,R*Math.max(0,Math.min(10,v||0))/10).map(n=>n.toFixed(1)).join(',')).join(' ');
    s+=`<polygon points="${dp}" fill="rgba(157,140,255,.32)" stroke="#b6a9ff" stroke-width="2"/>`;
    vals.forEach((v,i)=>{const [x,y]=pt(i,R*Math.max(0,Math.min(10,v||0))/10);s+=`<circle cx="${x}" cy="${y}" r="${labels?3:2}" fill="#ff7ac6"/>`});
  }
  if(labels){
    AREAS.forEach((a,i)=>{const [x,y]=pt(i,R+18);const anc=Math.abs(x-cx)<5?'middle':(x>cx?'start':'end');
      s+=`<text x="${x}" y="${y}" fill="#cfcbef" font-size="11" font-weight="600" text-anchor="${anc}" dominant-baseline="middle">${a.label}</text>`;
      if(vals) s+=`<text x="${x}" y="${y+13}" fill="#ffd166" font-size="12" font-weight="700" text-anchor="${anc}" dominant-baseline="middle">${(vals[i]||0).toFixed(1)}</text>`;
    });
  }
  return s+'</svg>';
}

/* =========================================================
   데이터 계층 1: 체험 모드 (localStorage + IndexedDB)
   ========================================================= */
function makeLocalBackend(){
  const K=k=>'lyra_'+k;
  const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(K(k)))??d}catch(e){return d}};
  const set=(k,v)=>localStorage.setItem(K(k),JSON.stringify(v));
  let idb, user=null; const urlCache={};
  const openIDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('lyra_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  async function tx(mode,fn){const db=idb||(idb=await openIDB());return new Promise((res,rej)=>{const t=db.transaction('files',mode);const req=fn(t.objectStore('files'));t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error)})}
  async function hash(s){
    if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
    let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'h'+h;
  }
  const pub=u=>({id:u.id,username:u.username,nickname:u.nickname,color:u.color});
  const nextId=k=>{const n=get('seq_'+k,0)+1;set('seq_'+k,n);return n};
  return {
    mode:'local',
    async init(){const sid=get('session',null);const u=get('users',[]).find(x=>x.id===sid);user=u?pub(u):null},
    getUser:()=>user,
    async signUp(username,pw,nickname,color){
      const users=get('users',[]);
      if(users.some(u=>u.username===username)) throw new Error('이미 있는 아이디예요');
      if(users.some(u=>u.nickname===nickname)) throw new Error('이미 쓰는 닉네임이에요');
      const u={id:uuid(),username,nickname,color,pw:await hash(username+':'+pw),created_at:new Date().toISOString()};
      users.push(u);set('users',users);set('session',u.id);user=pub(u);
    },
    async signIn(username,pw){
      const u=get('users',[]).find(x=>x.username===username);
      if(!u||u.pw!==await hash(username+':'+pw)) throw new Error('아이디 또는 비밀번호가 틀렸어요');
      set('session',u.id);user=pub(u);
    },
    async signOut(){set('session',null);user=null},
    async updateProfile({nickname,color}){
      const users=get('users',[]);
      if(users.some(u=>u.nickname===nickname&&u.id!==user.id)) throw new Error('이미 쓰는 닉네임이에요');
      const u=users.find(x=>x.id===user.id);u.nickname=nickname;u.color=color;set('users',users);user=pub(u);
    },
    async listAll(){return {songs:get('songs',[]),reviews:get('reviews',[]),likes:get('likes',[]),profiles:get('users',[]).map(pub)}},
    async createSong(data,file){
      const songs=get('songs',[]);const id=nextId('songs');
      const s={id,user_id:user.id,...data,created_at:new Date().toISOString()};
      if(file){s.file_path='f'+id;s.file_name=file.name;s.file_size=file.size;await tx('readwrite',st=>st.put(file,s.file_path))}
      songs.push(s);set('songs',songs);return s;
    },
    async deleteSong(song){
      set('songs',get('songs',[]).filter(s=>s.id!==song.id));
      set('reviews',get('reviews',[]).filter(r=>r.song_id!==song.id));
      set('likes',get('likes',[]).filter(l=>l.song_id!==song.id));
      if(song.file_path) await tx('readwrite',st=>st.delete(song.file_path));
    },
    async listReviews(songId){return get('reviews',[]).filter(r=>r.song_id===songId)},
    async saveReview(songId,data){
      const rs=get('reviews',[]);const now=new Date().toISOString();
      const ex=rs.find(r=>r.song_id===songId&&r.user_id===user.id);
      if(ex) Object.assign(ex,data,{updated_at:now});
      else rs.push({id:nextId('reviews'),song_id:songId,user_id:user.id,...data,created_at:now,updated_at:now});
      set('reviews',rs);
    },
    async deleteReview(id){set('reviews',get('reviews',[]).filter(r=>!(r.id===id&&r.user_id===user.id)))},
    async setLike(songId,on){
      let ls=get('likes',[]).filter(l=>!(l.song_id===songId&&l.user_id===user.id));
      if(on) ls.push({song_id:songId,user_id:user.id,created_at:new Date().toISOString()});
      set('likes',ls);
    },
    async mediaUrl(song){
      if(urlCache[song.file_path]) return urlCache[song.file_path];
      const blob=await tx('readonly',st=>st.get(song.file_path));
      if(!blob) throw new Error('파일을 찾을 수 없어요');
      return urlCache[song.file_path]=URL.createObjectURL(blob);
    },
    async download(song){const url=await this.mediaUrl(song);const a=document.createElement('a');a.href=url;a.download=song.file_name||'song';document.body.appendChild(a);a.click();a.remove()},
  };
}

/* =========================================================
   데이터 계층 2: 온라인 모드 (Supabase)
   ========================================================= */
function makeSupabaseBackend(){
  const sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  let user=null;
  const ok=({data,error})=>{if(error) throw error;return data};
  const toEmail=u=>`${u}@${CONFIG.EMAIL_DOMAIN}`;
  async function loadProfile(id){user=ok(await sb.from('profiles').select('id,username,nickname,color').eq('id',id).single())}
  function nice(e){
    const m=(e&&e.message)||String(e);
    if(/Invalid login/i.test(m)) return new Error('아이디 또는 비밀번호가 틀렸어요');
    if(/already registered|already exists/i.test(m)) return new Error('이미 있는 아이디예요');
    if(/duplicate key.*nickname/i.test(m)) return new Error('이미 쓰는 닉네임이에요');
    if(/email.*invalid|invalid.*email/i.test(m)) return new Error('가입 실패: CONFIG의 EMAIL_DOMAIN을 바꿔야 해요 ('+m+')');
    if(/row-level security/i.test(m)) return new Error('권한이 없어요 (로그인 상태를 확인하세요)');
    return new Error(m);
  }
  const wrap=fn=>async(...a)=>{try{return await fn(...a)}catch(e){throw nice(e)}};
  return {
    mode:'online',
    init:wrap(async()=>{const {data:{session}}=await sb.auth.getSession();if(session) await loadProfile(session.user.id)}),
    getUser:()=>user,
    signUp:wrap(async(username,pw,nickname,color)=>{
      const dup=ok(await sb.from('profiles').select('id,username,nickname').or(`username.eq.${username},nickname.eq.${JSON.stringify(nickname)}`));
      if(dup.some(d=>d.username===username)) throw new Error('이미 있는 아이디예요');
      if(dup.length) throw new Error('이미 쓰는 닉네임이에요');
      const d=ok(await sb.auth.signUp({email:toEmail(username),password:pw,options:{data:{username,nickname,color}}}));
      if(!d.session) throw new Error('가입은 됐지만 이메일 인증이 켜져 있어요. Supabase에서 Confirm email을 꺼 주세요');
      await loadProfile(d.user.id);
    }),
    signIn:wrap(async(username,pw)=>{const d=ok(await sb.auth.signInWithPassword({email:toEmail(username),password:pw}));await loadProfile(d.user.id)}),
    signOut:wrap(async()=>{await sb.auth.signOut();user=null}),
    updateProfile:wrap(async({nickname,color})=>{ok(await sb.from('profiles').update({nickname,color}).eq('id',user.id));user={...user,nickname,color}}),
    listAll:wrap(async()=>{
      const [s,r,l,p]=await Promise.all([
        sb.from('songs').select('*'),
        sb.from('reviews').select('id,song_id,user_id,stars,s_melody,s_lyrics,s_vocal,s_sound,s_mood,one_line,created_at,updated_at'),
        sb.from('likes').select('*'),
        sb.from('profiles').select('id,nickname,color'),
      ]);
      return {songs:ok(s),reviews:ok(r),likes:ok(l),profiles:ok(p)};
    }),
    createSong:wrap(async(data,file)=>{
      const row={user_id:user.id,...data};
      if(file){
        const ext=(file.name.split('.').pop()||'bin').toLowerCase();
        const path=`${user.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
        ok(await sb.storage.from(CONFIG.BUCKET).upload(path,file,{contentType:file.type||undefined}));
        Object.assign(row,{file_path:path,file_name:file.name,file_size:file.size});
      }
      return ok(await sb.from('songs').insert(row).select().single());
    }),
    deleteSong:wrap(async(song)=>{
      if(song.file_path) await sb.storage.from(CONFIG.BUCKET).remove([song.file_path]);
      ok(await sb.from('songs').delete().eq('id',song.id));
    }),
    listReviews:wrap(async(songId)=>ok(await sb.from('reviews').select('*').eq('song_id',songId))),
    saveReview:wrap(async(songId,data)=>{ok(await sb.from('reviews').upsert({song_id:songId,user_id:user.id,...data,updated_at:new Date().toISOString()},{onConflict:'song_id,user_id'}))}),
    deleteReview:wrap(async(id)=>{ok(await sb.from('reviews').delete().eq('id',id))}),
    setLike:wrap(async(songId,on)=>{
      if(on) ok(await sb.from('likes').insert({song_id:songId,user_id:user.id}));
      else ok(await sb.from('likes').delete().eq('song_id',songId).eq('user_id',user.id));
    }),
    async mediaUrl(song){return sb.storage.from(CONFIG.BUCKET).getPublicUrl(song.file_path).data.publicUrl},
    async download(song){
      const url=sb.storage.from(CONFIG.BUCKET).getPublicUrl(song.file_path,{download:song.file_name||true}).data.publicUrl;
      const a=document.createElement('a');a.href=url;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    },
  };
}

/* =========================================================
   앱 상태 & 화면
   ========================================================= */
let API;
const state={songs:[],profiles:{},view:'all',q:'',tag:null,sort:'new',detailId:null,form:null,playingId:null,queue:[],layout:localStorage.getItem('lyra_layout')||'grid',editing:false,rsort:'new'};

async function loadAll(){
  const {songs,reviews,likes,profiles}=await API.listAll();
  const me=API.getUser();const now=Date.now();
  state.profiles={};profiles.forEach(p=>state.profiles[p.id]=p);
  state.songs=songs.map(s=>{
    const rs=reviews.filter(r=>r.song_id===s.id);
    const ls=likes.filter(l=>l.song_id===s.id);
    const avg=k=>rs.length?rs.reduce((a,r)=>a+Number(r[k]),0)/rs.length:0;
    const latest=[...rs].sort((a,b)=>new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at))[0];
    return {...s,
      owner:state.profiles[s.user_id]||{nickname:'(알 수 없음)',color:'#666'},
      reviewCount:rs.length, avgStars:avg('stars'), areaAvg:AREAS.map(a=>avg(a.key)),
      likeCount:ls.length, liked:!!(me&&ls.some(l=>l.user_id===me.id)),
      weekLikes:ls.filter(l=>now-new Date(l.created_at)<WEEK).length,
      myReview:me?rs.find(r=>r.user_id===me.id):null,
      latestOneLine:latest?latest.one_line:'',
    };
  });
}

function hashHue(str){let h=0;for(const c of String(str))h=(h*31+c.charCodeAt(0))>>>0;return h%360}
function avatarHTML(p,cls=''){const n=(p&&p.nickname)||'?';return `<span class="avatar ${cls}" style="background:${esc((p&&p.color)||'#666')}">${esc([...n][0])}</span>`}
function genGrad(s){const h=hashHue(s.title+s.artist);return `linear-gradient(140deg,hsl(${h},75%,62%),hsl(${(h+55)%360},70%,42%) 60%,hsl(${(h+110)%360},60%,22%))`}
function labelBg(s){return s.source==='youtube'?`url('${ytThumb(esc(s.youtube_id))}')`:genGrad(s)}
function coverHTML(s){
  if(s.source==='youtube') return `<div class="gencover" style="background:${genGrad(s)};padding:0"><img class="cover yt" src="${ytThumb(esc(s.youtube_id))}" alt="" loading="lazy" onerror="this.remove()"></div>`;
  return `<div class="gencover" style="background:${genGrad(s)}"><span class="gi">${s.source==='mp4'?'🎬':'🎵'}</span><span class="gt">${esc(s.title)}</span></div>`;
}
function jacketHTML(s,extra=''){
  return `<div class="jw"><div class="vinyl"><div class="lbl" style="background-image:${labelBg(s)}"></div></div>
    <div class="jacket">${coverHTML(s)}<span class="badge ${s.source}">${s.source==='youtube'?'YOUTUBE':s.source.toUpperCase()}</span>${extra}</div></div>`;
}

function renderHeader(){
  const u=API.getUser();
  $('#modeBadge').textContent=API.mode==='online'?'온라인':'체험 모드 · 이 컴퓨터에만 저장';
  $('#modeBadge').className='mode'+(API.mode==='online'?' online':'');
  $('#userArea').innerHTML=u
    ?`<button class="userbtn" data-act="openProfile">${avatarHTML(u)} <span class="unick">${esc(u.nickname)}</span></button>`
    :`<button data-act="openAuth">로그인</button>`;
  $('#heroTitle').innerHTML=u?`${esc(u.nickname)}님, 오늘은 어떤 노래를 <em>나눠 볼까요?</em>`:`오늘은 어떤 노래를 <em>나눠 볼까요?</em>`;
}

function renderStats(){
  const reviews=state.songs.reduce((a,s)=>a+s.reviewCount,0);
  $('#stats').innerHTML=`<div class="stat"><b>${state.songs.length}</b><span>추천곡</span></div>
    <div class="stat"><b>${reviews}</b><span>리뷰</span></div>
    <div class="stat"><b>${Object.keys(state.profiles).length}</b><span>친구</span></div>`;
}

function renderFilters(){
  const used=new Set();state.songs.forEach(s=>(s.tags||[]).forEach(t=>used.add(t)));
  const tags=[...used].sort();
  $('#filters').innerHTML=`<div class="chips">`+
    `<button class="chip ${!state.tag?'on':''}" data-tag="">전체</button>`+
    tags.map(t=>`<button class="chip ${state.tag===t?'on':''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')+`</div>`+
    (state.view==='hot'?'':`<select id="sortSel">
      <option value="new">최신순</option><option value="stars">별점순</option>
      <option value="likes">좋아요순</option><option value="reviews">리뷰 많은 순</option></select>`)+
    `<div class="viewtog"><button data-layout="grid" class="${state.layout==='grid'?'on':''}" title="카드 보기">▦</button><button data-layout="list" class="${state.layout==='list'?'on':''}" title="목록 보기">☰</button></div>`;
  const sel=$('#sortSel');if(sel){sel.value=state.sort;sel.onchange=()=>{state.sort=sel.value;renderGrid()}}
}

function visibleSongs(){
  const me=API.getUser();let list=[...state.songs];
  if(state.view==='mine') list=me?list.filter(s=>s.user_id===me.id):[];
  if(state.view==='myreviews') list=me?list.filter(s=>s.myReview):[];
  if(state.tag) list=list.filter(s=>(s.tags||[]).includes(state.tag));
  const q=state.q.trim().toLowerCase();
  if(q) list=list.filter(s=>[s.title,s.artist,s.owner.nickname,...(s.tags||[])].join(' ').toLowerCase().includes(q));
  if(state.view==='hot') return list.filter(s=>s.weekLikes>0).sort((a,b)=>b.weekLikes-a.weekLikes||b.avgStars-a.avgStars).slice(0,20);
  const by={new:(a,b)=>new Date(b.created_at)-new Date(a.created_at),stars:(a,b)=>b.avgStars-a.avgStars||b.reviewCount-a.reviewCount,
    likes:(a,b)=>b.likeCount-a.likeCount,reviews:(a,b)=>b.reviewCount-a.reviewCount};
  return list.sort(by[state.sort]||by.new);
}

function cardHTML(s,i){
  const line=state.view==='myreviews'&&s.myReview?`내 한줄평 · ${s.myReview.one_line}`:s.latestOneLine;
  const extra=(state.view==='hot'?`<span class="rank">${i+1}</span>`:'')+`<button class="playbtn" data-play="${s.id}" title="재생">${state.playingId===s.id?'❚❚':'▶'}</button>`;
  return `<div class="card ${state.playingId===s.id?'playing':''}" data-open="${s.id}" style="animation-delay:${Math.min(i,12)*40}ms">
    ${jacketHTML(s,extra)}
    <div class="info">
      <div class="t">${esc(s.title)}</div>
      <div class="a">${esc(s.artist||'아티스트 미상')}</div>
      <div class="meta">${starsHTML(s.avgStars)} <span class="num">${s.reviewCount?s.avgStars.toFixed(1):'–'}</span><span class="rv">리뷰 ${s.reviewCount}</span>
        <span>${s.liked?'❤️':'🤍'} ${s.likeCount}${state.view==='hot'?` <b style="color:var(--acc2)">+${s.weekLikes}</b>`:''}</span></div>
      ${line?`<div class="oneline">“${esc(line)}”</div>`:`<div class="oneline none">아직 한줄평이 없어요</div>`}
      <div class="by">${avatarHTML(s.owner)} ${esc(s.owner.nickname)} · ${fmtDate(s.created_at)}</div>
      <div class="tagrow fix">${(s.tags||[]).slice(0,3).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
    </div></div>`;
}
function rowHTML(s,i){
  const line=state.view==='myreviews'&&s.myReview?`내 한줄평 · ${s.myReview.one_line}`:s.latestOneLine;
  const on=state.playingId===s.id;
  return `<div class="rowi ${on?'playing':''}" data-open="${s.id}" style="animation-delay:${Math.min(i,15)*25}ms">
    <div class="rn">${i+1}</div>
    <div class="rc">${coverHTML(s)}</div>
    <div class="rt"><b>${esc(s.title)}</b><span>${esc(s.artist||'아티스트 미상')}</span></div>
    <div class="rl">${line?'“'+esc(line)+'”':'<span style="color:var(--dim)">–</span>'}</div>
    <div class="rs">${starsHTML(s.avgStars)} <b style="color:var(--gold)">${s.reviewCount?s.avgStars.toFixed(1):'–'}</b> (${s.reviewCount})</div>
    <div class="rk">${s.liked?'❤️':'🤍'} ${s.likeCount}${state.view==='hot'?` <b style="color:var(--acc2)">+${s.weekLikes}</b>`:''}</div>
    <div class="rb2">${avatarHTML(s.owner)} ${esc(s.owner.nickname)}</div>
    <button class="pbtn" data-play="${s.id}">${on?'❚❚':'▶'}</button>
  </div>`;
}

function renderGrid(){
  const list=visibleSongs();const me=API.getUser();
  const g=$('#grid');g.classList.toggle('list',state.layout==='list');
  g.innerHTML=state.layout==='list'&&list.length
    ?`<div class="listhead"><span>#</span><span></span><span>제목</span><span class="hx">한줄평</span><span class="hx">별점</span><span class="hx">좋아요</span><span class="hx">추천인</span><span></span></div>`+list.map(rowHTML).join('')
    :list.map(cardHTML).join('');
  const empty=$('#empty');
  if(list.length){empty.classList.add('hidden');return}
  empty.classList.remove('hidden');
  const [icon,msg]=(state.view==='mine'||state.view==='myreviews')&&!me?['🔒','로그인하면 볼 수 있어요']:
    state.view==='hot'?['🔥','이번 주에 좋아요를 받은 노래가 아직 없어요']:
    state.view==='myreviews'?['✍️','아직 쓴 리뷰가 없어요']:
    state.view==='mine'?['💿','아직 추천한 노래가 없어요']:
    state.q||state.tag?['🔭','검색 결과가 없어요']:['🌌','아직 추천된 노래가 없어요. 첫 곡을 올려 보세요!'];
  empty.innerHTML=`<div class="ei">${icon}</div>${msg}`;
}

  try{await loadAll()}catch(e){toast('불러오기 실패: '+e.message,true)}
  renderHeader();renderStats();renderFilters();renderGrid();

}

/* ---------- 모달 공통 ---------- */
function openModal(id){$('#'+id).classList.remove('hidden')}
function closeModal(id){$('#'+id).classList.add('hidden');if(id==='detailModal')state.detailId=null}
function needLogin(){if(API.getUser())return false;openAuth('login');toast('먼저 로그인해 주세요');return true}
function colorPicker(el,cur,onPick){
  el.innerHTML=COLORS.map(c=>`<span data-c="${c}" style="background:${c}" class="${c===cur?'on':''}"></span>`).join('');
  el.onclick=e=>{const c=e.target.dataset.c;if(!c)return;$$('#'+el.id+' span').forEach(s=>s.classList.toggle('on',s.dataset.c===c));onPick(c)};
}

/* ---------- 로그인 / 회원가입 ---------- */
let authTab='login',authColor=COLORS[0];
function openAuth(tab){
  authTab=tab;['aUser','aPw','aPw2','aNick'].forEach(i=>$('#'+i).value='');$('#aErr').textContent='';
  $$('[data-authtab]').forEach(b=>b.classList.toggle('on',b.dataset.authtab===tab));
  $('#signupOnly').classList.toggle('hidden',tab!=='signup');
  $('#aSubmit').textContent=tab==='signup'?'가입하기':'로그인';$('#authTitle').textContent=tab==='signup'?'Lyra에 오신 걸 환영해요':'다시 만나서 반가워요';
  colorPicker($('#aColors'),authColor,c=>authColor=c);
  openModal('authModal');setTimeout(()=>$('#aUser').focus(),50);
}
async function submitAuth(){
  const err=$('#aErr');err.textContent='';
  const username=$('#aUser').value.trim().toLowerCase(),pw=$('#aPw').value;
  if(!/^[a-z0-9_]{3,20}$/.test(username)) return err.textContent='아이디는 영어 소문자·숫자·_ 3~20자예요';
  if(pw.length<6) return err.textContent='비밀번호는 6자 이상이에요';
  const btn=$('#aSubmit');btn.disabled=true;
  try{
    if(authTab==='signup'){
      const nick=$('#aNick').value.trim();
      if(pw!==$('#aPw2').value) throw new Error('비밀번호 확인이 달라요');
      if(nick.length<2||nick.length>12) throw new Error('닉네임은 2~12자예요');
      await API.signUp(username,pw,nick,authColor);toast(`환영해요, ${nick}님!`);
    }else{await API.signIn(username,pw);toast(`${API.getUser().nickname}님, 반가워요!`)}
    closeModal('authModal');await refresh();
  }catch(e){err.textContent=e.message}
  finally{btn.disabled=false}
}

/* ---------- 프로필 ---------- */
let profColor;
function openProfile(){
  const u=API.getUser();profColor=u.color;
  $('#pUser').textContent='아이디: '+u.username;const av=$('#pAvatar');av.textContent=[...u.nickname][0];av.style.background=u.color;$('#pNick').value=u.nickname;$('#pErr').textContent='';
  colorPicker($('#pColors'),u.color,c=>{profColor=c;$('#pAvatar').style.background=c});openModal('profileModal');
}

/* ---------- 노래 올리기 ---------- */
let upSrc='youtube',upTags=new Set();
function openUpload(){
  if(needLogin())return;
  upSrc='youtube';upTags=new Set();
  ['uLink','uTitle','uArtist','uTagCustom','uNote'].forEach(i=>$('#'+i).value='');
  $('#uFile').value='';$('#uErr').textContent='';$('#uPrev').classList.add('hidden');$('#uFileHint').textContent='파일을 골라 주세요';
  setSrc('youtube');renderUpTags();openModal('uploadModal');
}
function setSrc(src){
  upSrc=src;$$('[data-src]').forEach(b=>b.classList.toggle('on',b.dataset.src===src));
  $('#srcYoutube').classList.toggle('hidden',src!=='youtube');$('#srcFile').classList.toggle('hidden',src==='youtube');
  if(src!=='youtube'){
    const max=src==='mp3'?CONFIG.MAX_MP3_MB:CONFIG.MAX_MP4_MB;
    $('#uFileLabel').textContent=`${src.toUpperCase()} 파일 (최대 ${max}MB)`;
    $('#uFile').accept=src==='mp3'?'.mp3,audio/mpeg':'.mp4,video/mp4';$('#uFile').value='';$('#uFileHint').textContent='파일을 골라 주세요';
  }
}
function renderUpTags(){$('#uTags').innerHTML=PRESET_TAGS.map(t=>`<button class="chip ${upTags.has(t)?'on':''}" data-uptag="${t}">#${t}</button>`).join('')}
async function onLinkInput(){
  const id=ytId($('#uLink').value);const img=$('#uPrev');
  if(!id){img.classList.add('hidden');return}
  img.src=ytThumb(id);img.classList.remove('hidden');
  if($('#uTitle').value) return;
  try{
    const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
    const j=await r.json();
    if(j.title&&!$('#uTitle').value) $('#uTitle').value=j.title;
    if(j.author_name&&!$('#uArtist').value) $('#uArtist').value=j.author_name.replace(/ - Topic$/,'');
  }catch(e){/* 자동 입력 실패 시 직접 입력 */}
}
function onFilePick(){
  const f=$('#uFile').files[0];if(!f)return;
  const max=(upSrc==='mp3'?CONFIG.MAX_MP3_MB:CONFIG.MAX_MP4_MB)*1048576;
  $('#uFileHint').textContent=`${f.name} · ${fmtSize(f.size)}`+(f.size>max?' — 너무 커요!':'');
  if(!$('#uTitle').value){
    const base=f.name.replace(/\.[^.]+$/,'');const m=base.split(/\s+-\s+/);
    if(m.length>=2){$('#uArtist').value=$('#uArtist').value||m[0];$('#uTitle').value=m.slice(1).join(' - ')}else $('#uTitle').value=base;
  }
}
async function submitUpload(){
  const err=$('#uErr');err.textContent='';
  const title=$('#uTitle').value.trim();
  const custom=$('#uTagCustom').value.split(',').map(t=>t.trim().replace(/^#/,'')).filter(Boolean);
  const tags=[...new Set([...upTags,...custom])].slice(0,10);
  const data={title,artist:$('#uArtist').value.trim(),source:upSrc,tags,note:$('#uNote').value.trim()};
  let file=null;
  if(upSrc==='youtube'){const id=ytId($('#uLink').value);if(!id)return err.textContent='올바른 유튜브 링크를 넣어 주세요';data.youtube_id=id}
  else{
    file=$('#uFile').files[0];if(!file) return err.textContent='파일을 골라 주세요';
    const ext=file.name.split('.').pop().toLowerCase();if(ext!==upSrc) return err.textContent=`${upSrc.toUpperCase()} 파일만 올릴 수 있어요`;
    const max=upSrc==='mp3'?CONFIG.MAX_MP3_MB:CONFIG.MAX_MP4_MB;
    if(file.size>max*1048576) return err.textContent=`파일이 ${max}MB보다 커요`;
  }
  if(!title) return err.textContent='제목을 입력해 주세요';
  const btn=$('#uSubmit');btn.disabled=true;btn.textContent='올리는 중...';
  try{
    const s=await API.createSong(data,file);
    closeModal('uploadModal');toast('추천 완료! 내 평가도 남겨 보세요');
    await refresh();openDetail(s.id);
  }catch(e){err.textContent='실패: '+e.message}
  finally{btn.disabled=false;btn.textContent='올리기'}
}

/* ---------- 상세 & 리뷰 ---------- */

function setRangeFill(inp){inp.style.setProperty('--p',((inp.value-inp.min)/(inp.max-inp.min)*100)+'%')}

        <div class="kind">${s.source==='youtube'?'YOUTUBE':s.source.toUpperCase()} · ${esc(s.owner.nickname)} 추천</div>

        <div class="art">${esc(s.artist||'아티스트 미상')}</div>
        <div class="by" style="margin-top:10px">${avatarHTML(s.owner)} ${esc(s.owner.nickname)} · ${fmtDate(s.created_at)}
          ${s.file_size?` · ${s.file_name?esc(s.file_name)+' ':''}(${fmtSize(s.file_size)})`:''}</div>
        ${(s.tags||[]).length?`<div class="tagrow">${s.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}
        <div class="actions">
          <button class="primary" data-play="${s.id}">${playing?'❚❚ 재생 중':'▶ 재생'}</button>
          ${s.source!=='youtube'?`<button data-dl="${s.id}">⬇ 다운로드</button>`:`<a href="https://www.youtube.com/watch?v=${esc(s.youtube_id)}" target="_blank" rel="noopener"><button>YouTube에서 열기 ↗</button></a>`}
          <button class="likebtn ${s.liked?'on':''}" data-like="${s.id}">${s.liked?'❤️':'🤍'} ${s.likeCount}</button>
          ${isOwner?`<button class="danger ghost" data-delsong="${s.id}">삭제</button>`:''}
        </div>
        ${s.note?`<div class="note">💬 ${esc(s.note)}</div>`:''}
      </div>
    </div>
  </div>

    <div>
      <div class="panel scorebox">
        <div class="hint" style="margin-bottom:6px">모두의 평가</div>
        <div class="big">${s.reviewCount?s.avgStars.toFixed(1):'–'}</div>
        <div style="margin:6px 0">${starsHTML(s.avgStars,22)}</div>
        <div class="hint">리뷰 ${s.reviewCount}개 평균</div>
        <div style="margin-top:6px;display:flex;justify-content:center">${radar(s.reviewCount?s.areaAvg:null,250)}</div>
        ${s.reviewCount?`<div class="bars">${AREAS.map((a,i)=>`<div class="bar"><span>${a.label}</span><div class="tr"><div class="fl" style="width:${s.areaAvg[i]*10}%"></div></div><b>${s.areaAvg[i].toFixed(1)}</b></div>`).join('')}</div>

            <div class="ol">“${esc(r.one_line)}”</div>
            <div class="scores">${AREAS.map((a,i)=>`<span>${a.label} <b>${vals[i]}</b></span>`).join('')}</div>

function bindReviewForm(songId){
  const f=state.form;const si=$('#starIn');
  const valAt=e=>{const r=si.getBoundingClientRect();return Math.max(.5,Math.min(5,Math.ceil((e.clientX-r.left)/r.width*10)/2))};
  const show=v=>{si.innerHTML=starsHTML(v);$('#starVal').textContent=v?v.toFixed(1):''};
  si.onmousemove=e=>show(valAt(e));si.onmouseleave=()=>show(f.stars);si.onclick=e=>{f.stars=valAt(e);show(f.stars)};
  $$('[data-area]').forEach(inp=>{setRangeFill(inp);inp.oninput=()=>{const i=+inp.dataset.area;f.scores[i]=+inp.value;setRangeFill(inp);$('#sv'+i).textContent=inp.value;$('#formRadar').innerHTML=radar(f.scores,230)}});
  $('#rOne').oninput=e=>{f.one_line=e.target.value;$('#rOneCnt').textContent=f.one_line.length+'/60'};$('#rBody').oninput=e=>f.body=e.target.value;
  $('#rSave').onclick=async()=>{
    const err=$('#rErr');err.textContent='';
    if(!f.stars) return err.textContent='별점을 매겨 주세요';
    if(!f.one_line.trim()) return err.textContent='한줄평을 써 주세요';
    const data={stars:f.stars,one_line:f.one_line.trim(),body:f.body.trim()};AREAS.forEach((a,i)=>data[a.key]=f.scores[i]);
    $('#rSave').disabled=true;
    try{await API.saveReview(songId,data);toast('⭐ 평가 저장 완료!');state.form=null;state.editing=false;await refresh()}
    catch(e){err.textContent='실패: '+e.message;$('#rSave').disabled=false}
  };
}

/* ---------- 재생 (커스텀 플레이어) ---------- */
let ctl=null, playToken=0, ytPlayer=null, ytReady=null, seeking=false;
const fmtT=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function getVol(){const v=+localStorage.getItem('lyra_vol');return isNaN(v)||localStorage.getItem('lyra_vol')===null?80:v}
function loadYT(){
  if(ytReady) return ytReady;
  ytReady=new Promise((res,rej)=>{
    if(window.YT&&window.YT.Player) return res();
    const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{prev&&prev();res()};
    const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';
    sc.onerror=()=>{ytReady=null;rej(new Error('YouTube API 로딩 실패'))};document.head.appendChild(sc);
    setTimeout(()=>rej(new Error('YouTube API 시간 초과')),8000);
  });
  return ytReady;
}
function fileCtl(el){return {play:()=>el.play().catch(()=>{}),pause:()=>el.pause(),paused:()=>el.paused,time:()=>el.currentTime,dur:()=>isFinite(el.duration)?el.duration:0,seek:t=>{el.currentTime=t},vol:v=>{el.volume=v/100}}}
function ytCtl(p){return {play:()=>p.playVideo&&p.playVideo(),pause:()=>p.pauseVideo&&p.pauseVideo(),
  paused:()=>!p.getPlayerState||[1,3].indexOf(p.getPlayerState())<0,time:()=>p.getCurrentTime?p.getCurrentTime():0,dur:()=>p.getDuration?p.getDuration():0,
  seek:t=>p.seekTo&&p.seekTo(t,true),vol:v=>p.setVolume&&p.setVolume(v)}}

function markPlaying(){
  $$('#grid [data-open]').forEach(c=>{const on=+c.dataset.open===state.playingId;c.classList.toggle('playing',on);const b=c.querySelector('[data-play]');if(b)b.textContent=on?'❚❚':'▶'});
  document.body.classList.toggle('playing',!!state.playingId);
}
function cleanupMedia(){
  if(ytPlayer){try{ytPlayer.destroy()}catch(e){}ytPlayer=null}
  const m=$('#pmedia');m.querySelectorAll('audio,video').forEach(el=>{el.pause();el.removeAttribute('src');el.load()});m.innerHTML='';ctl=null;
}
async function play(id,fromQueue){
  const s=state.songs.find(x=>x.id===id);if(!s)return;
  if(state.playingId===id&&ctl){ctl.paused()?ctl.play():ctl.pause();return}
  if(!fromQueue) state.queue=visibleSongs().map(x=>x.id);
  if(!state.queue.includes(id)) state.queue=[id,...state.queue];
  const token=++playToken;
  cleanupMedia();
  const box=$('#pmedia'),player=$('#player');
  player.classList.remove('hidden','bigmode');
  $('#plbl').style.backgroundImage=labelBg(s);
  $('#ptitle').textContent=s.title;$('#partist').textContent=(s.artist||'아티스트 미상')+' · '+s.owner.nickname+' 추천';$('#pextra').innerHTML='';
  $('#pseek').value=0;$('#pcur').textContent='0:00';$('#pdur').textContent='0:00';
  state.playingId=id;markPlaying();
  if(state.detailId===id) renderDetail();
  box.className=s.source==='mp3'?'audio':'';
  $('#pbig').classList.toggle('hidden',s.source==='mp3');
  if(s.source==='youtube'){
    $('#pextra').innerHTML=` · <a href="https://www.youtube.com/watch?v=${esc(s.youtube_id)}" target="_blank" rel="noopener">YouTube ↗</a>`;
    box.innerHTML='<div id="ytp"></div>';
    try{
      await loadYT();if(token!==playToken)return;
      ytPlayer=new YT.Player('ytp',{videoId:s.youtube_id,playerVars:{autoplay:1,playsinline:1,rel:0,modestbranding:1},
        events:{onReady:e=>{if(token!==playToken)return;e.target.setVolume(getVol());e.target.playVideo()},
          onStateChange:e=>{if(e.data===0&&token===playToken)playNext(1)},
          onError:()=>{if(token===playToken)toast('이 영상은 앱 안에서 재생할 수 없어요. YouTube ↗ 로 열어 주세요',true)}}});
      ctl=ytCtl(ytPlayer);
    }catch(e){
      if(token!==playToken)return;
      box.innerHTML=`<iframe src="https://www.youtube.com/embed/${esc(s.youtube_id)}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      ctl=null;
    }
  }else{
    try{
      const url=await API.mediaUrl(s);if(token!==playToken)return;
      const el=document.createElement(s.source==='mp4'?'video':'audio');el.playsInline=true;el.src=url;el.volume=getVol()/100;
      el.onended=()=>{if(token===playToken)playNext(1)};
      el.onclick=()=>{ctl&&(ctl.paused()?ctl.play():ctl.pause())};
      box.appendChild(el);ctl=fileCtl(el);ctl.play();
    }catch(e){toast('재생 실패: '+e.message,true)}
  }
}
function playNext(dir){
  const q=(state.queue||[]).filter(id=>state.songs.some(s=>s.id===id));
  if(!q.length){stopPlayer();return}
  let i=q.indexOf(state.playingId);
  if(dir<0&&ctl&&ctl.time()>3){ctl.seek(0);return}
  i=i<0?0:(i+dir+q.length)%q.length;
  if(dir>0&&i===0&&q.indexOf(state.playingId)===q.length-1){toast('목록의 마지막 곡이었어요');stopPlayer();return}
  state.playingId=null;play(q[i],true);
}
function stopPlayer(){
  playToken++;cleanupMedia();$('#player').classList.add('hidden');$('#player').classList.remove('bigmode');
  const was=state.playingId;state.playingId=null;markPlaying();document.body.classList.remove('paused');
  if(was&&state.detailId===was)renderDetail();
}
/* 진행 상태 갱신 */
setInterval(()=>{
  if(!state.playingId){return}
  const paused=!ctl||ctl.paused();
  document.body.classList.toggle('paused',paused&&!!ctl);
  $('#ptoggle').textContent=paused?'▶':'❚❚';
  if(!ctl) return;
  const d=ctl.dur(),t=ctl.time();
  $('#pdur').textContent=fmtT(d);
  if(!seeking){$('#pcur').textContent=fmtT(t);const sk=$('#pseek');sk.value=d?Math.round(t/d*1000):0;setRangeFill(sk)}
},300);

/* ---------- 이벤트 ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-open],[data-close]');if(!t)return;
  const d=t.dataset;
  if(d.close) return closeModal(d.close);
  if(d.play){e.stopPropagation();return play(+d.play)}
  if(d.open) return openDetail(+d.open);
  if(d.act==='openUpload') return openUpload();
  if(d.act==='home'){state.view='all';state.tag=null;state.q='';$('#search').value='';$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view==='all'));renderFilters();renderGrid();return scrollTo({top:0})}
  if(d.act==='openAuth') return openAuth('login');
  if(d.act==='openProfile') return openProfile();
  if(d.authtab) return openAuth(d.authtab);
  if(d.view){state.view=d.view;$$('#tabs button').forEach(b=>b.classList.toggle('on',b===t));renderFilters();return renderGrid()}
  if(d.layout){state.layout=d.layout;localStorage.setItem('lyra_layout',d.layout);renderFilters();return renderGrid()}
  if(d.rsort){state.rsort=d.rsort;return renderDetail()}
  if(d.act==='editReview'){if(needLogin())return;state.editing=true;return renderDetail()}
  if(d.act==='cancelEdit'){state.editing=false;state.form=null;return renderDetail()}
  if(d.tag!==undefined){state.tag=d.tag||null;renderFilters();return renderGrid()}
  if(d.src) return setSrc(d.src);
  if(d.uptag){upTags.has(d.uptag)?upTags.delete(d.uptag):upTags.add(d.uptag);return renderUpTags()}
  if(d.more!==undefined){const b=t.previousElementSibling;b.classList.toggle('clip');t.textContent=b.classList.contains('clip')?'더보기':'접기';return}
  try{
    if(d.like){if(needLogin())return;const s=state.songs.find(x=>x.id===+d.like);t.disabled=true;await API.setLike(s.id,!s.liked);return refresh()}
    if(d.dl){const s=state.songs.find(x=>x.id===+d.dl);toast('다운로드를 시작해요');return API.download(s)}
    if(d.delsong){const s=state.songs.find(x=>x.id===+d.delsong);if(!confirm(`"${s.title}" 추천을 삭제할까요? 리뷰도 함께 사라져요.`))return;
      if(s.source!=='youtube'&&$('#pmedia').innerHTML) stopPlayer();await API.deleteSong(s);closeModal('detailModal');toast('삭제했어요');return refresh()}
    if(d.delrev){if(!confirm('내 리뷰를 삭제할까요?'))return;await API.deleteReview(+d.delrev);state.form=null;toast('리뷰를 삭제했어요');return refresh()}
  }catch(err){toast(err.message,true)}
});
$('#aSubmit').onclick=submitAuth;
$('#authModal').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth()});
$('#pSave').onclick=async()=>{
  const nick=$('#pNick').value.trim();if(nick.length<2)return $('#pErr').textContent='닉네임은 2~12자예요';
  try{await API.updateProfile({nickname:nick,color:profColor});closeModal('profileModal');toast('저장했어요');refresh()}catch(e){$('#pErr').textContent=e.message}
};
$('#pLogout').onclick=async()=>{await API.signOut();closeModal('profileModal');toast('로그아웃했어요');if(state.view!=='all'&&state.view!=='hot'){state.view='all';$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view==='all'))}refresh()};
$('#uLink').addEventListener('input',onLinkInput);
$('#uFile').addEventListener('change',onFilePick);
$('#uSubmit').onclick=submitUpload;
$('#search').addEventListener('input',e=>{state.q=e.target.value;renderGrid()});
$('#pclose').onclick=stopPlayer;
$('#pbig').onclick=()=>{const p=$('#player');p.classList.toggle('bigmode');$('#pbig').textContent=p.classList.contains('bigmode')?'⤡':'⤢'};
$('#ptoggle').onclick=()=>{if(ctl)ctl.paused()?ctl.play():ctl.pause()};
$('#pprev').onclick=()=>playNext(-1);$('#pnext').onclick=()=>playNext(1);
$('#pinfo').onclick=e=>{if(e.target.closest('a'))return;if(state.playingId)openDetail(state.playingId)};
const sk=$('#pseek');
sk.addEventListener('input',()=>{seeking=true;setRangeFill(sk);if(ctl)$('#pcur').textContent=fmtT(sk.value/1000*ctl.dur())});
sk.addEventListener('change',()=>{if(ctl)ctl.seek(sk.value/1000*ctl.dur());seeking=false});
const pv=$('#pvol');pv.value=getVol();setRangeFill(pv);
pv.addEventListener('input',()=>{setRangeFill(pv);localStorage.setItem('lyra_vol',pv.value);if(ctl)ctl.vol(+pv.value)});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(e.code==='Space'&&state.playingId&&ctl){e.preventDefault();ctl.paused()?ctl.play():ctl.pause()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.modal:not(.hidden)').forEach(m=>closeModal(m.id))});
$$('.modal').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m)closeModal(m.id)}));

/* ---------- 시작 ---------- */
/* 오픈 이펙트: 별이 반짝이고 LP가 돌며 거문고자리(Lyra)가 그려져요 */
function runIntro(){
  const intro=$('#intro');const title=$('#introTitle');
  title.innerHTML=[...CONFIG.APP_NAME].map((c,i)=>`<span style="animation-delay:${1.3+i*.09}s">${esc(c)}</span>`).join('');
  const cv=$('#introStars'),ctx=cv.getContext('2d');let W,H,stars,raf,t0=performance.now();
  const size=()=>{W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
    stars=Array.from({length:220},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.4+.3)*devicePixelRatio,p:Math.random()*6.28,s:Math.random()*2+1}))};
  size();addEventListener('resize',size);
  const draw=now=>{const t=(now-t0)/1000;ctx.clearRect(0,0,W,H);
    for(const s of stars){const dx=(s.x-W/2),dy=(s.y-H/2);const k=1+Math.min(t,3)*.04*s.s;
      ctx.globalAlpha=Math.min(1,t*1.5)*(.35+.65*Math.abs(Math.sin(s.p+t*s.s)));ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(W/2+dx*k,H/2+dy*k,s.r,0,6.28);ctx.fill()}
    raf=requestAnimationFrame(draw)};
  raf=requestAnimationFrame(draw);
  let done=false;
  const end=()=>{if(done)return;done=true;intro.classList.add('out');setTimeout(()=>{cancelAnimationFrame(raf);removeEventListener('resize',size);intro.remove()},800)};
  intro.addEventListener('click',end);addEventListener('keydown',end,{once:true});
  setTimeout(end,3300);
}

(async()=>{
  document.title=CONFIG.APP_NAME;$('#appName').textContent=CONFIG.APP_NAME;
  runIntro();renderSkeleton();
  const online=CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY;
  if(online&&!window.supabase){toast('Supabase를 불러오지 못했어요 (인터넷 연결 확인). 체험 모드로 열어요',true)}
  API=(online&&window.supabase)?makeSupabaseBackend():makeLocalBackend();
  try{await API.init()}catch(e){toast('로그인 정보 확인 실패: '+e.message,true)}
  await refresh();
  // 온라인 모드: 30초마다 새 글 확인
  if(API.mode==='online') setInterval(()=>{if(!$$('.modal:not(.hidden)').length)refresh()},30000);
})();
</script>
