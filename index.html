<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE87</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --black:#000;--base:#121212;--el:#181818;--el2:#1f1f1f;--hl:#2a2a2a;--hl2:#333;
  --text:#fff;--sub:#b3b3b3;--dim:#7a7a7a;--line:rgba(255,255,255,.1);
  --green:#1ed760;--green2:#3be477;--grgb:30,215,96;--gold:#ffd166;--danger:#f15e6c;
  --sidew:340px;--rightw:340px;--toph:64px;--playerh:72px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#000;color:var(--text);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;font-size:14px}
svg.i{width:var(--s,24px);height:var(--s,24px);fill:currentColor;flex:none;display:block}
button{font:inherit;cursor:pointer;border:none;background:transparent;color:var(--text);border-radius:999px;padding:8px 16px;transition:transform .1s,background .15s,color .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:scale(.96)}
button.primary{background:var(--green);color:#000;font-weight:800}
button.primary:hover{background:var(--green2);transform:scale(1.04)}
button.outline{border:1px solid #7c7c7c;color:#fff;font-weight:700;padding:7px 15px}
button.outline:hover{border-color:#fff;transform:scale(1.04)}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.ib{width:32px;height:32px;padding:0;color:var(--sub)}
.ib:hover{color:#fff;transform:scale(1.06)}
.ib.on{color:var(--green)}
input,textarea,select{font:inherit;background:#2a2a2a;color:#fff;border:1px solid transparent;border-radius:6px;padding:11px 12px;width:100%;outline:none;transition:.15s}
input:hover,textarea:hover,select:hover{border-color:#555}
input:focus,textarea:focus,select:focus{border-color:#fff;background:#333}
textarea{resize:vertical;min-height:100px;line-height:1.6}
label{display:block;font-size:13px;color:#fff;margin:16px 0 8px;font-weight:700}
.hidden{display:none!important}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border:3px solid transparent;background-clip:content-box;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.4)}::-webkit-scrollbar-track{background:transparent}

/* ===== 오픈 이펙트 (초록 테마) ===== */
#intro{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .7s,transform .7s,filter .7s;overflow:hidden}
#intro::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 45%,rgba(var(--grgb),.38) 0%,rgba(var(--grgb),.1) 25%,transparent 55%);animation:glowIn 1.6s ease both,glowPulse 2.4s ease-in-out 1.6s infinite}
@keyframes glowIn{from{opacity:0;transform:scale(.6)}}
@keyframes glowPulse{50%{opacity:.7;transform:scale(1.06)}}
#intro.out{opacity:0;transform:scale(1.08);filter:blur(6px);pointer-events:none}
#introStars{position:absolute;inset:0}
.intro-core{position:relative;display:flex;flex-direction:column;align-items:center}
.intro-rings{position:absolute;left:50%;top:58%;width:0;height:0;z-index:0}
.intro-wave{display:flex;align-items:center;gap:5px;height:90px;margin-bottom:6px;position:relative;z-index:1}
.intro-wave i{width:6px;border-radius:3px;background:linear-gradient(180deg,#b8ffd2,var(--green) 55%,#0e8f3b);box-shadow:0 0 12px rgba(var(--grgb),.6);height:4px;opacity:0;
  animation:waveIn .35s ease forwards,wave 1s ease-in-out infinite alternate}
@keyframes waveIn{to{opacity:1}}
@keyframes wave{0%{height:6px}100%{height:var(--h,60px)}}
.intro-rings i{position:absolute;left:-100px;top:-100px;width:200px;height:200px;border-radius:50%;border:2px solid rgba(var(--grgb),.7);opacity:0;animation:ringOut 2.4s cubic-bezier(.2,.7,.3,1) infinite}
.intro-rings i:nth-child(2){animation-delay:.8s}.intro-rings i:nth-child(3){animation-delay:1.6s}
@keyframes ringOut{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(3.2)}}
@keyframes vinylIn{from{transform:scale(.2) rotate(-90deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{rotate:360deg}}
@keyframes draw{to{stroke-dashoffset:0}}
.intro-title{margin-top:0;font-size:92px;line-height:1;position:relative;z-index:1;font-weight:900;letter-spacing:-.03em;display:flex;position:relative;
  background:linear-gradient(100deg,var(--green) 0%,#b8ffd2 45%,#fff 50%,#b8ffd2 55%,var(--green) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:titleShine 2.5s linear 1.6s infinite;filter:drop-shadow(0 0 22px rgba(var(--grgb),.45))}
@keyframes titleShine{from{background-position:120% 0}to{background-position:-120% 0}}
.intro-title span{opacity:0;transform:translateY(24px) scale(.9);animation:up .6s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes up{to{opacity:1;transform:none}}
@keyframes eqIn{to{opacity:1}}
@keyframes eqb{0%{height:3px}100%{height:26px}}
.intro-charge{width:260px;margin:14px 0 16px;position:relative;opacity:0;animation:up .5s ease 1.3s forwards}
.ic-track{height:6px;border-radius:99px;background:rgba(255,255,255,.08);position:relative;overflow:visible}
.ic-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,#0e8f3b,var(--green),#b8ffd2);box-shadow:0 0 14px rgba(var(--grgb),.8);animation:charge 1.3s cubic-bezier(.3,.7,.2,1) 1.5s forwards}
.ic-fill::after{content:"";position:absolute;right:-4px;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;transform:translateY(-50%);box-shadow:0 0 12px var(--green)}
@keyframes charge{to{width:87%}}
.ic-100{position:absolute;right:0;top:-18px;font-size:10px;color:#3f6b4e;font-weight:700;letter-spacing:.05em}
.ic-100::after{content:"";position:absolute;right:0;top:16px;width:1px;height:10px;background:#3f6b4e}
.ic-lbl{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#6fae86;letter-spacing:.1em}
.ic-lbl b{color:var(--green);font-variant-numeric:tabular-nums;font-size:13px}
.intro-sub{color:#9fdcb4;letter-spacing:.3em;font-size:13px;opacity:0;animation:up .8s ease 2s forwards;position:relative}
.intro-skip{position:absolute;bottom:28px;color:#3f6b4e;font-size:12px;opacity:0;animation:up .6s ease 1.2s forwards}
.intro-sweep{position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(var(--grgb),.25) 50%,transparent 60%);transform:translateX(-100%);animation:sweep 1.1s ease 2.4s forwards;pointer-events:none}
@keyframes sweep{to{transform:translateX(100%)}}

.intro-title em{font-style:normal;font-variant-numeric:tabular-nums;display:inline-block;min-width:1.15em;background:linear-gradient(180deg,#fff,#b8ffd2);-webkit-background-clip:text;background-clip:text}
/* ===== 상단바 ===== */
.topbar{height:var(--toph);display:flex;align-items:center;gap:8px;padding:0 8px 0 20px;position:relative}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand-disc{width:32px;height:32px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 1.5px,#2a2a2a 1.5px 3px);position:relative;flex:none;box-shadow:0 0 0 1px #333}
.brand-disc::after{content:"";position:absolute;inset:33%;border-radius:50%;background:var(--green)}
body.playing:not(.paused) .brand-disc{animation:spin 3s linear infinite}
.logo{font-size:22px;font-weight:900;letter-spacing:-.03em}
.topcenter{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;width:min(560px,44vw)}
.homebtn{width:48px;height:48px;padding:0;background:var(--el2);color:var(--sub);flex:none}
.homebtn:hover{background:var(--hl);color:#fff;transform:scale(1.04)}
.homebtn.on{color:#fff}
.searchbox{flex:1;position:relative}
.searchbox .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.searchbox input{height:48px;padding:0 44px 0 48px;border-radius:999px;background:var(--el2);border:2px solid transparent;font-size:15px}
.searchbox input:hover{background:var(--hl);border-color:#333}
.searchbox input:focus{border-color:#fff;background:var(--hl)}
.searchbox input::placeholder{color:#888}
.searchbox .sx{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.topright{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbtn{background:#fff;color:#000;font-weight:800;height:40px;padding:0 18px;font-size:14px;white-space:nowrap}
.topbtn:hover{transform:scale(1.04)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#111;flex:none}
.userbtn{padding:0;width:40px;height:40px;background:var(--el2)}
.userbtn:hover{transform:scale(1.04);background:var(--hl)}
.loginbtn{background:transparent;color:#fff;font-weight:800;height:40px;padding:0 18px;font-size:14px;border:1px solid #7c7c7c;white-space:nowrap}
.loginbtn:hover{border-color:#fff}
.loginbtn:hover{transform:scale(1.04)}

/* ===== 3단 레이아웃 ===== */
.app{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr) var(--rightw);gap:8px;padding:0 8px;height:calc(100vh - var(--toph) - var(--playerh))}
body.noright .app{grid-template-columns:var(--sidew) minmax(0,1fr) 0}
body.noright .rightp{display:none}
.side,.mainwrap,.rightp{background:var(--base);border-radius:8px;min-height:0;overflow:hidden}
/* 라이브러리 */
.side{display:flex;flex-direction:column}
.libhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px 16px}
.libhead h3{margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.createbtn{background:var(--el2);color:#fff;font-weight:700;padding:8px 16px 8px 12px}
.createbtn:hover{background:var(--hl);transform:scale(1.04)}
.libchips{display:flex;gap:8px;padding:8px 16px}
.chip{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--el2);color:#fff;font-weight:500}
.chip:hover{background:var(--hl)}
.chip.on{background:#fff;color:#000}
.libtools{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 4px 10px}
.libtools .lsearch{display:flex;align-items:center;gap:4px;flex:1}
.libtools input{height:32px;padding:4px 8px;font-size:13px;background:var(--hl);width:0;opacity:0;transition:width .2s,opacity .2s}
.libtools.open input{width:180px;opacity:1}
.libtools .sortlbl{color:var(--sub);font-size:13px;display:flex;align-items:center;gap:6px;padding:4px 8px}
.libscroll{overflow:auto;flex:1;min-height:0;padding:0 8px 8px}
.libitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px;border-radius:6px;color:#fff;justify-content:flex-start}
.libitem:hover{background:var(--el2)}
.libitem.on{background:var(--hl)}
.libitem .lc{width:48px;height:48px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;overflow:hidden;position:relative}
.libitem .lc.round{border-radius:50%}
.libitem .ln{min-width:0;display:flex;flex-direction:column;gap:2px}
.libitem b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libitem.on b,.libitem.playing b{color:var(--green)}
.libitem span.s{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
.pin{color:var(--green)}
.side-foot{padding:8px 16px 12px;border-top:1px solid #1e1e1e}
.mode{font-size:11px;color:var(--dim)}
.mode.online{color:var(--green)}
.mode.online::before{content:"●";margin-right:6px;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.3}}

/* 메인 */
.mainwrap{position:relative}
.mainscroll{height:100%;overflow:auto;position:relative}
.topglow{position:absolute;left:0;right:0;top:0;height:332px;pointer-events:none;z-index:0;transition:background .6s}
main{padding:16px 24px 40px;position:relative;z-index:1}
.homechips{display:flex;gap:8px;margin:4px 0 16px;position:sticky;top:0;z-index:5;padding:8px 0}
.mainscroll.scrolled .homechips{background:var(--base)}

/* 홈 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:32px}
.tile{display:flex;align-items:center;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;cursor:pointer;height:48px;position:relative;transition:background .2s}
.tile:hover{background:rgba(255,255,255,.17)}
.tile .tc{width:48px;height:48px;flex:none}
.tile .gencover{padding:5px}.tile .gt{display:none}.tile .gi{font-size:14px}
.tile b{padding:0 48px 0 10px;font-size:13px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.tile .tp{position:absolute;right:8px;width:32px;height:32px;padding:0;background:var(--green);color:#000;opacity:0;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.tile:hover .tp,.tile.playing .tp{opacity:1}
.tile.playing b{color:var(--green)}
.shelf{margin-bottom:36px}
.shelf-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.shelf-h .lbl{font-size:13px;color:var(--sub);display:block;margin-bottom:2px}
.shelf-h h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.shelf-h h2:hover{text-decoration:underline}
.shelf-h>button{color:var(--sub);font-weight:700;font-size:14px;padding:0}
.shelf-h>button:hover{text-decoration:underline;color:#fff}
.shelf .grid{grid-template-rows:1fr;grid-auto-rows:0;overflow:hidden;row-gap:0;margin:0 -12px}

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:0}
.card{background:transparent;border-radius:6px;padding:12px;cursor:pointer;transition:background .25s;animation:cardIn .4s ease both;min-width:0}
.card:hover{background:var(--el2)}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}}
.cimg{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);margin-bottom:8px;background:#282828}
.cover{width:100%;height:100%;object-fit:cover;display:block}
.cover.yt{transform:scale(1.36)}
.gencover{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px;position:relative;overflow:hidden}
.gencover::before{content:"";position:absolute;width:140%;aspect-ratio:1;border-radius:50%;right:-60%;bottom:-70%;background:rgba(255,255,255,.12)}
.gencover .gi{font-size:24px;opacity:.9;align-self:flex-end}
.gencover .gt{font-weight:900;font-size:20px;line-height:1.15;color:#fff;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;position:relative}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;letter-spacing:.05em;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:4px;color:#fff}
.playbtn{position:absolute;bottom:8px;right:8px;width:48px;height:48px;padding:0;background:var(--green);color:#000;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;box-shadow:0 8px 8px rgba(0,0,0,.3)}
.playbtn:hover{background:var(--green2);transform:scale(1.05)!important}
.card:hover .playbtn,.card.playing .playbtn{opacity:1;transform:none}
.card .t{font-weight:500;font-size:16px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.playing .t{color:var(--green)}
.card .a{font-size:14px;color:var(--sub);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.card .a .st{color:var(--gold)}
.stars{position:relative;display:inline-block;letter-spacing:1px;line-height:1}
.stars .bg{color:#3e3e3e}
.stars .fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold)}
.tag{font-size:12px;color:#fff;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:999px}
.tag:hover{background:rgba(255,255,255,.2)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--sub);text-align:center;padding:70px 0}
.empty .ei{font-size:54px;margin-bottom:12px}
.empty b{display:block;color:#fff;font-size:22px;margin-bottom:6px}
.skel{border-radius:6px;aspect-ratio:1;background:linear-gradient(100deg,#1c1c1c 30%,#2a2a2a 50%,#1c1c1c 70%);background-size:300% 100%;animation:shimmer 1.4s infinite}
.skel-l{height:14px;border-radius:4px;margin-top:12px;width:70%;background:#1f1f1f}
@keyframes shimmer{to{background-position:-150% 0}}

/* 검색 둘러보기 */
.browse-h{font-size:24px;font-weight:800;margin:8px 0 16px}
.btiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.btile{aspect-ratio:1.6;border-radius:8px;position:relative;overflow:hidden;cursor:pointer;padding:16px;font-size:22px;font-weight:800;letter-spacing:-.02em;transition:transform .15s}
.btile:hover{transform:scale(1.02)}
.btile .bt-art{position:absolute;right:-14px;bottom:-6px;width:96px;height:96px;transform:rotate(25deg);border-radius:4px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.btile .bt-art .gt{display:none}.btile .bt-art .gencover{padding:8px}

/* 목록 페이지 헤더 */
.phero{display:flex;align-items:flex-end;gap:24px;padding:24px 24px 24px;margin:-16px -24px 0;position:relative}
.pcov{width:232px;height:232px;flex:none;border-radius:4px;overflow:hidden;box-shadow:0 4px 60px rgba(0,0,0,.5);display:grid;grid-template-columns:1fr 1fr;background:#282828}
.pcov.one{grid-template-columns:1fr;display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:900}
.pcov>div{overflow:hidden}
.pcov .gencover{padding:8px}.pcov .gencover .gt,.pcov .gencover .gi{display:none}
.ph-txt{min-width:0;flex:1}
.ph-kind{font-size:14px;font-weight:500}
.ph-title{font-size:clamp(32px,6.2vw,96px);font-weight:900;letter-spacing:-.04em;line-height:1.05;margin:4px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-desc{font-size:14px;color:rgba(255,255,255,.7);margin-bottom:8px}
.ph-meta{font-size:14px;color:#fff;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ph-meta .avatar{width:24px;height:24px;font-size:11px}
.ph-meta b{font-weight:700}
.ph-meta .d{color:rgba(255,255,255,.7)}
.pfade{margin:0 -24px;padding:24px 24px 0;position:relative}
.actionbar{display:flex;align-items:center;gap:24px;padding:0 0 24px;position:relative;z-index:1;flex-wrap:wrap}
.bigplay{width:56px;height:56px;padding:0;background:var(--green);color:#000;box-shadow:0 8px 16px rgba(0,0,0,.3)}
.bigplay:hover{transform:scale(1.04);background:var(--green2)}
.actionbar .chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.actionbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.actionbar select{width:auto;background:transparent;color:var(--sub);font-size:14px;padding:6px 8px;border:none}
.actionbar select:hover{color:#fff}
.actionbar select option{background:#282828}
.layoutbtn{color:var(--sub);font-size:14px;padding:6px 8px}
.layoutbtn:hover{color:#fff}

/* 트랙 목록 */
.grid.list{display:block}
.listhead,.rowi{display:grid;grid-template-columns:16px minmax(200px,6fr) minmax(120px,4fr) minmax(90px,2fr) minmax(100px,2fr) 96px;gap:16px;align-items:center;padding:0 16px}
.listhead{height:36px;border-bottom:1px solid var(--line);margin-bottom:16px;font-size:14px;color:var(--sub);position:sticky;top:0;background:var(--base);z-index:4;margin-left:-24px;margin-right:-24px;padding:0 40px}
.listhead .r{text-align:right}
.rowi{height:56px;border-radius:4px;cursor:pointer}
.rowi:hover{background:rgba(255,255,255,.1)}
.rowi.sel{background:rgba(255,255,255,.3)}
.rowi .rn{color:var(--sub);text-align:right;font-size:16px;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end}
.rowi .rn .pl{display:none;color:#fff}
.rowi:hover .rn .num{display:none}.rowi:hover .rn .pl{display:block}
.rowi.playing .rn .num{color:var(--green)}
.rowi .rtw{display:flex;align-items:center;gap:12px;min-width:0}
.rowi .rc{width:40px;height:40px;border-radius:4px;overflow:hidden;flex:none}
.rowi .rc .gencover{padding:4px}.rowi .rc .gi{font-size:12px}.rowi .rc .gt{display:none}
.rowi .rt{min-width:0}

.panel{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.05)}
.big{background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

/* 지금 재생 중 */
.rightp{transition:background .9s}
.np-art{position:relative;margin-bottom:12px}
.np-art::before{content:"";position:absolute;inset:8%;background:var(--npg);filter:blur(38px);opacity:.85;z-index:0;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45;transform:scale(.9)}}
.np-art .np-cover{position:relative;z-index:1;margin:0;transition:transform .4s}
body.playing:not(.paused) .np-art .np-cover{animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) scale(1.01)}}
#pmedia{box-shadow:0 10px 40px -10px var(--npc,rgba(0,0,0,.6))}
.viz{display:flex;align-items:flex-end;gap:3px;height:44px;margin:2px 0 16px}
.viz i{flex:1;background:linear-gradient(to top,var(--green),#7bf5ff 70%,#c79bff);border-radius:2px 2px 1px 1px;height:6%;transition:height .11s linear;opacity:.9}
.np-card{background:rgba(255,255,255,.07);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.05);transition:transform .25s,background .25s}
.np-card:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}

/* 재생바 */
#player::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--green),#7bf5ff,#c79bff,var(--green),transparent);background-size:200% 100%;opacity:0;transition:opacity .4s;animation:flow 3s linear infinite}
body.playing:not(.paused) #player::before{opacity:1}
@keyframes flow{to{background-position:-200% 0}}
#pseek{background:linear-gradient(90deg,var(--green),#7bf5ff) 0/var(--p,0%) 100% no-repeat,#4d4d4d}
#pseek:hover{background:linear-gradient(90deg,var(--green),#7bf5ff) 0/var(--p,0%) 100% no-repeat,#5a5a5a}
body.playing:not(.paused) .pl-btns .pplay{animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.pcover{box-shadow:0 0 22px hsla(var(--ph,150),85%,55%,.55);transition:box-shadow .6s}

/* 파티클 */
.burst{position:fixed;z-index:400;pointer-events:none;font-size:18px;animation:burst .9s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot));opacity:0}}
#toast{background:linear-gradient(90deg,#fff,#dcffe9);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 30px rgba(var(--grgb),.25)}

  try{
    const u=new URL(url);
    if(u.hostname.includes('youtu.be')){const v=u.pathname.slice(1,12);return YTID.test(v)?v:null}
    if(u.hostname.includes('youtube.com')){
      if(u.searchParams.get('v')){const v=u.searchParams.get('v').slice(0,11);return YTID.test(v)?v:null}
      const m=u.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/); if(m) return m[2];
    }
  }catch(e){}
  return /^[\w-]{11}$/.test(url)?url:null;
}
const YTID=/^[\w-]{11}$/;
const ytThumb = id => YTID.test(id||'')?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:'';
const safeColor=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#666666';
const SRC_OK=['youtube','mp3','mp4'];
function starsHTML(v,size){const p=Math.max(0,Math.min(5,v||0))/5*100;return `<span class="stars" style="${size?'font-size:'+size+'px':''}"><span class="bg">★★★★★</span><span class="fg" style="width:${p}%">★★★★★</span></span>`}

/* 오각형 레이더 차트 (값 0~10) */
function radar(vals, size=240, labels=true){
  const cx=size/2, cy=size/2, R=size/2-(labels?46:6);
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const poly=r=>[0,1,2,3,4].map(i=>pt(i,r).map(n=>n.toFixed(1)).join(',')).join(' ');
  const pad=labels?34:0;let s=`<svg width="${size+pad*2}" height="${size}" viewBox="${-pad} 0 ${size+pad*2} ${size}" style="max-width:100%">`;
  for(const lv of [2,4,6,8,10]) s+=`<polygon points="${poly(R*lv/10)}" fill="none" stroke="rgba(160,150,255,.18)" stroke-width="1"/>`;
  for(let i=0;i<5;i++){const [x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(160,150,255,.18)"/>`}
  if(vals){
    const dp=vals.map((v,i)=>pt(i,R*Math.max(0,Math.min(10,v||0))/10).map(n=>n.toFixed(1)).join(',')).join(' ');
    s+=`<polygon points="${dp}" fill="rgba(157,140,255,.32)" stroke="#b6a9ff" stroke-width="2"/>`;
    vals.forEach((v,i)=>{const [x,y]=pt(i,R*Math.max(0,Math.min(10,v||0))/10);s+=`<circle cx="${x}" cy="${y}" r="${labels?3:2}" fill="#ff7ac6"/>`});
  }
  if(labels){
    AREAS.forEach((a,i)=>{const [x,y]=pt(i,R+18);const anc=Math.abs(x-cx)<5?'middle':(x>cx?'start':'end');
      s+=`<text x="${x}" y="${y}" fill="#cfcbef" font-size="11" font-weight="600" text-anchor="${anc}" dominant-baseline="middle">${a.label}</text>`;
      if(vals) s+=`<text x="${x}" y="${y+13}" fill="#ffd166" font-size="12" font-weight="700" text-anchor="${anc}" dominant-baseline="middle">${(vals[i]||0).toFixed(1)}</text>`;
    });
  }
  return s+'</svg>';
}

/* =========================================================
   데이터 계층 1: 체험 모드 (localStorage + IndexedDB)
   ========================================================= */
function makeLocalBackend(){
  const K=k=>'lyra_'+k;
  const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(K(k)))??d}catch(e){return d}};
  const set=(k,v)=>localStorage.setItem(K(k),JSON.stringify(v));
  let idb, user=null; const urlCache={};
  const openIDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('lyra_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  async function tx(mode,fn){const db=idb||(idb=await openIDB());return new Promise((res,rej)=>{const t=db.transaction('files',mode);const req=fn(t.objectStore('files'));t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error)})}
  async function hash(s){
    if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
    let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'h'+h;
  }
  const pub=u=>({id:u.id,username:u.username,nickname:u.nickname,color:u.color,avatar_url:u.avatar_url||null,bio:u.bio||'',banner:u.banner||null,fav_tags:u.fav_tags||[],pinned_song:u.pinned_song||null});
  const nextId=k=>{const n=get('seq_'+k,0)+1;set('seq_'+k,n);return n};
  return {
    mode:'local',
    async init(){const sid=get('session',null);const u=get('users',[]).find(x=>x.id===sid);user=u?pub(u):null},
    getUser:()=>user,
    async signUp(username,pw,nickname,color){
      const users=get('users',[]);
      if(users.some(u=>u.username===username)) throw new Error('이미 있는 아이디예요');
      if(users.some(u=>u.nickname===nickname)) throw new Error('이미 쓰는 닉네임이에요');
      const u={id:uuid(),username,nickname,color,pw:await hash(username+':'+pw),created_at:new Date().toISOString()};
      users.push(u);set('users',users);set('session',u.id);user=pub(u);
    },
    async signIn(username,pw){
      const u=get('users',[]).find(x=>x.username===username);
      if(!u||u.pw!==await hash(username+':'+pw)) throw new Error('아이디 또는 비밀번호가 틀렸어요');
      set('session',u.id);user=pub(u);
    },
    async signOut(){set('session',null);user=null},
    async updateProfile(f){
      const users=get('users',[]);
      if(f.nickname&&users.some(u=>u.nickname===f.nickname&&u.id!==user.id)) throw new Error('이미 쓰는 닉네임이에요');
      const u=users.find(x=>x.id===user.id);Object.assign(u,f);
      try{set('users',users)}catch(e){throw new Error('저장 공간이 부족해요 (사진을 더 작게 해 주세요)')}
      user=pub(u);
    },
    uploadAvatar:blob=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob)}),
    async listAll(){return {songs:get('songs',[]),reviews:get('reviews',[]),likes:get('likes',[]),profiles:get('users',[]).map(pub)}},
    async createSong(data,file){
      const songs=get('songs',[]);const id=nextId('songs');
      const s={id,user_id:user.id,...data,created_at:new Date().toISOString()};
      if(file){s.file_path='f'+id;s.file_name=file.name;s.file_size=file.size;await tx('readwrite',st=>st.put(file,s.file_path))}
      songs.push(s);set('songs',songs);return s;
    },
    async deleteSong(song){
      set('songs',get('songs',[]).filter(s=>s.id!==song.id));
      set('reviews',get('reviews',[]).filter(r=>r.song_id!==song.id));
      set('likes',get('likes',[]).filter(l=>l.song_id!==song.id));
      if(song.file_path){await tx('readwrite',st=>st.delete(song.file_path));if(urlCache[song.file_path]){URL.revokeObjectURL(urlCache[song.file_path]);delete urlCache[song.file_path]}}
    },
    async listReviews(songId){return get('reviews',[]).filter(r=>r.song_id===songId)},
    async saveReview(songId,data){
      const rs=get('reviews',[]);const now=new Date().toISOString();
      const ex=rs.find(r=>r.song_id===songId&&r.user_id===user.id);
      if(ex) Object.assign(ex,data,{updated_at:now});
      else rs.push({id:nextId('reviews'),song_id:songId,user_id:user.id,...data,created_at:now,updated_at:now});
      set('reviews',rs);
    },
    async deleteReview(id){set('reviews',get('reviews',[]).filter(r=>!(r.id===id&&r.user_id===user.id)))},
    async setLike(songId,on){
      let ls=get('likes',[]).filter(l=>!(l.song_id===songId&&l.user_id===user.id));
      if(on) ls.push({song_id:songId,user_id:user.id,created_at:new Date().toISOString()});
      set('likes',ls);
    },
    async mediaUrl(song){
      if(urlCache[song.file_path]) return urlCache[song.file_path];
      const blob=await tx('readonly',st=>st.get(song.file_path));
      if(!blob) throw new Error('파일을 찾을 수 없어요');
      return urlCache[song.file_path]=URL.createObjectURL(blob);
    },
    async download(song){const url=await this.mediaUrl(song);const a=document.createElement('a');a.href=url;a.download=song.file_name||'song';document.body.appendChild(a);a.click();a.remove()},
  };
}

/* =========================================================
   데이터 계층 2: 온라인 모드 (Supabase)
   ========================================================= */
function makeSupabaseBackend(){
  let user=null;
  const sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.localStorage}});
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT'&&user){user=null;refresh(true)}});
  const ok=({data,error})=>{if(error) throw error;return data};
  const toEmail=u=>`${u}@${CONFIG.EMAIL_DOMAIN}`;
  async function loadProfile(id){user=ok(await sb.from('profiles').select('*').eq('id',id).single())}
  function nice(e){
    const m=(e&&e.message)||String(e);
    if(/Invalid login/i.test(m)) return new Error('아이디 또는 비밀번호가 틀렸어요');
    if(/already registered|already exists/i.test(m)) return new Error('이미 있는 아이디예요');
    if(/duplicate key.*nickname/i.test(m)) return new Error('이미 쓰는 닉네임이에요');
    if(/email.*invalid|invalid.*email/i.test(m)) return new Error('가입 실패: CONFIG의 EMAIL_DOMAIN을 바꿔야 해요 ('+m+')');
    if(/row-level security/i.test(m)) return new Error('권한이 없어요 (로그인 상태를 확인하세요)');
    if(/Database error saving new user|check constraint|profiles_nickname/i.test(m)) return new Error('입력값을 확인해 주세요 (닉네임 2~12자, 중복 불가)');
    if(/mime type|not supported/i.test(m)) return new Error('MP3·MP4 파일만 올릴 수 있어요');
    return new Error(m);
  }
  const wrap=fn=>async(...a)=>{try{return await fn(...a)}catch(e){throw nice(e)}};
  return {
    mode:'online',
    init:wrap(async()=>{const {data:{session}}=await sb.auth.getSession();if(session) await loadProfile(session.user.id)}),
    getUser:()=>user,
    signUp:wrap(async(username,pw,nickname,color)=>{
      if(ok(await sb.from('profiles').select('id').eq('username',username)).length) throw new Error('이미 있는 아이디예요');
      if(ok(await sb.from('profiles').select('id').ilike('nickname',nickname.replace(/[%_\\]/g,'\\$&'))).length) throw new Error('이미 쓰는 닉네임이에요');
      const d=ok(await sb.auth.signUp({email:toEmail(username),password:pw,options:{data:{username,nickname,color}}}));
      if(!d.session) throw new Error('가입은 됐지만 이메일 인증이 켜져 있어요. Supabase에서 Confirm email을 꺼 주세요');
      await loadProfile(d.user.id);
    }),
    signIn:wrap(async(username,pw)=>{const d=ok(await sb.auth.signInWithPassword({email:toEmail(username),password:pw}));await loadProfile(d.user.id)}),
    signOut:wrap(async()=>{await sb.auth.signOut();user=null}),
    updateProfile:wrap(async(f)=>{ok(await sb.from('profiles').update(f).eq('id',user.id));user={...user,...f}}),
    uploadAvatar:wrap(async(blob)=>{const path=`${user.id}/avatar_${Date.now()}.jpg`;ok(await sb.storage.from(CONFIG.BUCKET).upload(path,blob,{contentType:'image/jpeg'}));return sb.storage.from(CONFIG.BUCKET).getPublicUrl(path).data.publicUrl}),
    listAll:wrap(async()=>{
      const all=async q=>{let out=[],i=0;for(;;){const {data,error}=await q().range(i,i+999);if(error)throw error;out=out.concat(data);if(data.length<1000)return out;i+=1000}};
      const [songs,reviews,likes,profiles]=await Promise.all([
        all(()=>sb.from('songs').select('*').order('id')),
        all(()=>sb.from('reviews').select('id,song_id,user_id,stars,s_melody,s_lyrics,s_vocal,s_sound,s_mood,one_line,body,created_at,updated_at').order('id')),
        all(()=>sb.from('likes').select('song_id,user_id,created_at').order('song_id').order('user_id')),
        all(()=>sb.from('profiles').select('*').order('id')),
      ]);
      return {songs,reviews,likes,profiles};
    }),
    createSong:wrap(async(data,file)=>{
      const row={user_id:user.id,...data};
      if(file){
        const ext=(file.name.split('.').pop()||'bin').toLowerCase();
        const path=`${user.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
        ok(await sb.storage.from(CONFIG.BUCKET).upload(path,file,{contentType:ext==='mp3'?'audio/mpeg':'video/mp4'}));
        Object.assign(row,{file_path:path,file_name:file.name,file_size:file.size});
      }
      return ok(await sb.from('songs').insert(row).select().single());
    }),
    deleteSong:wrap(async(song)=>{
      if(song.file_path) await sb.storage.from(CONFIG.BUCKET).remove([song.file_path]);
      ok(await sb.from('songs').delete().eq('id',song.id));
    }),
    listReviews:wrap(async(songId)=>ok(await sb.from('reviews').select('*').eq('song_id',songId))),
    saveReview:wrap(async(songId,data)=>{ok(await sb.from('reviews').upsert({song_id:songId,user_id:user.id,...data,updated_at:new Date().toISOString()},{onConflict:'song_id,user_id'}))}),
    deleteReview:wrap(async(id)=>{ok(await sb.from('reviews').delete().eq('id',id))}),
    setLike:wrap(async(songId,on)=>{
      if(on) ok(await sb.from('likes').insert({song_id:songId,user_id:user.id}));
      else ok(await sb.from('likes').delete().eq('song_id',songId).eq('user_id',user.id));
    }),
    async mediaUrl(song){return sb.storage.from(CONFIG.BUCKET).getPublicUrl(song.file_path).data.publicUrl},
    async download(song){
      const url=sb.storage.from(CONFIG.BUCKET).getPublicUrl(song.file_path,{download:song.file_name||true}).data.publicUrl;
      const a=document.createElement('a');a.href=url;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    },
  };
}

function hashHue(str){let h=0;for(const c of String(str))h=(h*31+c.charCodeAt(0))>>>0;return h%360}

/* ---------- 내 기기 파일 (업로드 없이 이 브라우저에서 재생) ---------- */
const LocalFiles=(()=>{
  let db;const urls={};
  const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('lyra_local_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(db=r.result);r.onerror=()=>rej(r.error)});
  async function tx(mode,fn){const d=db||await open();return new Promise((res,rej)=>{const t=d.transaction('f',mode);const q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
  return {
    list(){try{return JSON.parse(localStorage.getItem('lyra_localfiles'))||[]}catch(e){return[]}},
    save(l){localStorage.setItem('lyra_localfiles',JSON.stringify(l))},
    async add(files){
      const l=this.list();let min=Math.min(0,+(localStorage.getItem('lyra_local_seq')||0),...l.map(x=>x.id));let added=0;
      for(const f of files){
        const ext=(f.name.split('.').pop()||'').toLowerCase();
        if(!['mp3','mp4'].includes(ext)){toast(`${f.name}: MP3·MP4만 추가할 수 있어요`,true);continue}
        const id=--min;await tx('readwrite',s=>s.put(f,id));
        const base=f.name.replace(/\.[^.]+$/,'');const m=base.split(/\s+-\s+/);
        l.unshift({id,title:m.length>1?m.slice(1).join(' - '):base,artist:m.length>1?m[0]:'',source:ext,file_name:f.name,file_size:f.size,created_at:new Date().toISOString()});added++;
      }
      this.save(l);localStorage.setItem('lyra_local_seq',min);return added;
    },
    async remove(id){await tx('readwrite',s=>s.delete(id));this.save(this.list().filter(x=>x.id!==id));if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}},
    async url(id){if(urls[id])return urls[id];const b=await tx('readonly',s=>s.get(id));if(!b)throw new Error('파일을 찾을 수 없어요');return urls[id]=URL.createObjectURL(b)},
    file(id){return tx('readonly',s=>s.get(id))},
  };
})();

const PERSON='<svg viewBox="0 0 24 24" style="width:62%;height:62%;fill:rgba(255,255,255,.92)"><path d="M12 12.2a4.6 4.6 0 1 0 0-9.2 4.6 4.6 0 0 0 0 9.2zm0 1.9c-4.4 0-8.3 2.3-8.3 5.6V21h16.6v-1.3c0-3.3-3.9-5.6-8.3-5.6z"/></svg>';
const avCache=new Map();
function avSrc(a){if(!a.startsWith('data:'))return a;let u=avCache.get(a);if(!u){try{const [h,b]=a.split(',');const bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);u=URL.createObjectURL(new Blob([arr],{type:h.slice(5).split(';')[0]}))}catch(e){u=a}avCache.set(a,u)}return u}
function avatarInner(p){
  const a=p&&p.avatar_url;
  if(a&&a.startsWith('preset:')) return `<svg viewBox="0 0 10 10" style="width:100%;height:100%"><text x="5" y="6.9" font-size="5.6" text-anchor="middle">${esc(a.slice(7))}</text></svg>`;

/* 이미지 → 256px 정사각 JPEG */
function resizeImage(file,size=256){
  return new Promise((res,rej)=>{
    const img=new Image();img.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
      const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);
      c.toBlob(b=>b?res(b):rej(new Error('이미지를 바꾸지 못했어요')),'image/jpeg',.86);URL.revokeObjectURL(img.src)};
    img.onerror=()=>rej(new Error('이미지 파일을 읽지 못했어요'));img.src=URL.createObjectURL(file);
  });
}

async function saveProfile(){

  try{
    let avatar_url=pe.avatar_url;
    if(pe.file){avatar_url=await API.uploadAvatar(await resizeImage(pe.file))}
    await API.updateProfile({nickname:nick,color:pe.color,bio:$('#pBio').value.trim().slice(0,120),banner:pe.banner||null,fav_tags:pe.fav_tags,pinned_song:pe.pinned_song||null,avatar_url:avatar_url||null});

}

function visibleSongs(){
  const me=API.getUser();let list=state.view==='local'?[...(state.local||[])]:[...state.songs];
  if(state.view==='recent'){const q=state.q.trim().toLowerCase();return getRecent().map(findSong).filter(Boolean).filter(s=>!q||[s.title,s.artist].join(' ').toLowerCase().includes(q))}
  if(state.view==='liked') list=list.filter(s=>s.liked);
  if(state.view==='todo') list=me?list.filter(s=>!s.myReview&&s.user_id!==me.id):[];
  if(state.view==='mine') list=me?list.filter(s=>s.user_id===me.id):[];
  if(state.view==='myreviews') list=me?list.filter(s=>s.myReview):[];
  if(state.tag) list=list.filter(s=>(s.tags||[]).includes(state.tag));
  if(state.friend) list=list.filter(s=>s.user_id===state.friend);
  if(state.srcf&&state.srcf!=='all') list=list.filter(s=>s.source===state.srcf);
  const q=state.q.trim().toLowerCase();
  if(q) list=list.filter(s=>[s.title,s.artist,s.owner.nickname,...(s.tags||[])].join(' ').toLowerCase().includes(q));
  if(state.view==='hot') return list.filter(s=>s.weekLikes>0).sort((a,b)=>b.weekLikes-a.weekLikes||b.avgStars-a.avgStars).slice(0,50);
  const by={new:(a,b)=>new Date(b.created_at)-new Date(a.created_at),stars:(a,b)=>b.avgStars-a.avgStars||b.reviewCount-a.reviewCount,
    likes:(a,b)=>b.likeCount-a.likeCount,reviews:(a,b)=>b.reviewCount-a.reviewCount};
  return list.sort(by[state.sort]||by.new);
}

let lastSig='';
async function refresh(force=true){
  try{await loadAll()}catch(e){toast('불러오기 실패: '+e.message,true)}
  loadLocal();
  const u=API.getUser();
  const sig=JSON.stringify([u&&u.id,u&&u.nickname,u&&u.avatar_url,state.songs.map(s=>[s.id,s.likeCount,s.reviewCount,s.avgStars,s.liked,s.latestOneLine,s.title]),Object.values(state.profiles).map(p=>[p.id,p.nickname,p.avatar_url,p.color,p.bio]),state.local.length]);
  if(!force&&sig===lastSig)return;
  if(!force&&(state.view==='settings'||document.activeElement&&document.activeElement.matches('input,textarea,select')))return;
  lastSig=sig;
  renderHeader();renderFilters();renderGrid();updatePlayerLike();renderNow();

}

let authTab='login',authColor=COLORS[0];
function openAuth(tab){
  authTab=tab;['aUser','aPw','aPw2','aNick'].forEach(i=>$('#'+i).value='');$('#aErr').textContent='';
  $$('[data-authtab]').forEach(b=>b.classList.toggle('on',b.dataset.authtab===tab));
  $('#signupOnly').classList.toggle('hidden',tab!=='signup');
  $('#aSubmit').textContent=tab==='signup'?'가입하기':'로그인';$('#authTitle').textContent=tab==='signup'?'RE87에 오신 걸 환영해요':'다시 만나서 반가워요';
  colorPicker($('#aColors'),authColor,c=>authColor=c);
  openModal('authModal');setTimeout(()=>$('#aUser').focus(),50);
}
async function submitAuth(){
  if($('#aSubmit').disabled)return;state.form=null;
  const err=$('#aErr');err.textContent='';
  const username=$('#aUser').value.trim().toLowerCase(),pw=$('#aPw').value;
  if(!/^[a-z0-9_]{3,20}$/.test(username)) return err.textContent='아이디는 영어 소문자·숫자·_ 3~20자예요';
  if(pw.length<6) return err.textContent='비밀번호는 6자 이상이에요';
  const btn=$('#aSubmit');btn.disabled=true;
  try{
    if(authTab==='signup'){
      const nick=$('#aNick').value.trim();
      if(pw!==$('#aPw2').value) throw new Error('비밀번호 확인이 달라요');
      if(nick.length<2||nick.length>12) throw new Error('닉네임은 2~12자예요');
      await API.signUp(username,pw,nick,authColor);toast(`환영해요, ${nick}님!`);
    }else{await API.signIn(username,pw);toast(`${API.getUser().nickname}님, 반가워요!`)}
    closeModal('authModal');await refresh();
  }catch(e){err.textContent=e.message}
  finally{btn.disabled=false}
}

let upSrc='youtube',upTags=new Set();
function openUpload(){
  if(needLogin())return;
  upSrc='youtube';upTags=new Set();
  ['uLink','uTitle','uArtist','uTagCustom','uNote'].forEach(i=>$('#'+i).value='');
  $('#uFile').value='';$('#uErr').textContent='';$('#uPrev').classList.add('hidden');$('#uFileHint').textContent='파일을 골라 주세요';
  setSrc('youtube');renderUpTags();openModal('uploadModal');
}
function setSrc(src){
  upSrc=src;$$('[data-src]').forEach(b=>b.classList.toggle('on',b.dataset.src===src));
  $('#srcYoutube').classList.toggle('hidden',src!=='youtube');$('#srcFile').classList.toggle('hidden',src==='youtube');
  if(src!=='youtube'){
    const max=src==='mp3'?CONFIG.MAX_MP3_MB:CONFIG.MAX_MP4_MB;
    $('#uFileLabel').textContent=`${src.toUpperCase()} 파일 (최대 ${max}MB)`;
    $('#uFile').accept=src==='mp3'?'.mp3,audio/mpeg':'.mp4,video/mp4';$('#uFile').value='';$('#uFileHint').textContent='파일을 골라 주세요';
  }

function renderUpTags(){$('#uTags').innerHTML=PRESET_TAGS.map(t=>`<button class="chip ${upTags.has(t)?'on':''}" data-uptag="${t}">#${t}</button>`).join('')}
async function onLinkInput(){
  const id=ytId($('#uLink').value);const img=$('#uPrev');
  if(!id){img.classList.add('hidden');return}
  img.src=ytThumb(id);img.classList.remove('hidden');
  if($('#uTitle').value) return;
  try{
    const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
    const j=await r.json();
    if(j.title&&!$('#uTitle').value) $('#uTitle').value=j.title;
    if(j.author_name&&!$('#uArtist').value) $('#uArtist').value=j.author_name.replace(/ - Topic$/,'');
  }catch(e){/* 자동 입력 실패 시 직접 입력 */}
}
function onFilePick(){
  const f=$('#uFile').files[0];if(!f)return;
  const max=(upSrc==='mp3'?CONFIG.MAX_MP3_MB:CONFIG.MAX_MP4_MB)*1048576;
  $('#uFileHint').textContent=`${f.name} · ${fmtSize(f.size)}`+(f.size>max?' — 너무 커요!':'');
  if(!$('#uTitle').value){
    const base=f.name.replace(/\.[^.]+$/,'');const m=base.split(/\s+-\s+/);
    if(m.length>=2){$('#uArtist').value=$('#uArtist').value||m[0];$('#uTitle').value=m.slice(1).join(' - ')}else $('#uTitle').value=base;
  }
}
async function submitUpload(){
  const err=$('#uErr');err.textContent='';
  const title=$('#uTitle').value.trim();
  const custom=$('#uTagCustom').value.split(',').map(t=>t.trim().replace(/^#/,'')).filter(Boolean);
  const tags=[...new Set([...upTags,...custom])].slice(0,10);
  const data={title,artist:$('#uArtist').value.trim(),source:upSrc,tags,note:$('#uNote').value.trim()};
  let file=null;
  if(upSrc==='youtube'){const id=ytId($('#uLink').value);if(!id)return err.textContent='올바른 유튜브 링크를 넣어 주세요';data.youtube_id=id}
  else{
    file=$('#uFile').files[0];if(!file) return err.textContent='파일을 골라 주세요';
    const ext=file.name.split('.').pop().toLowerCase();if(ext!==upSrc) return err.textContent=`${upSrc.toUpperCase()} 파일만 올릴 수 있어요`;
    const max=upSrc==='mp3'?CONFIG.MAX_MP3_MB:CONFIG.MAX_MP4_MB;
    if(file.size>max*1048576) return err.textContent=`파일이 ${max}MB보다 커요`;
  }
  if(!title) return err.textContent='제목을 입력해 주세요';
  const btn=$('#uSubmit');btn.disabled=true;btn.textContent='올리는 중...';
  try{
    const s=await API.createSong(data,file);
    burst($('#uSubmit'),['🎵','🎶','✨','💿'],20);closeModal('uploadModal');toast('추천 완료! 내 평가도 남겨 보세요');
    await refresh();openDetail(s.id);
  }catch(e){err.textContent='실패: '+e.message}
  finally{btn.disabled=false;btn.textContent='올리기'}
}

let vizRaf=0;const vizBars=[];let vizT=0;
function vizFrame(){
  const v=document.getElementById('viz');
  const active=v&&v.offsetParent&&S.viz&&!S.reduce&&state.playingId&&(!ctl||!ctl.paused())&&!document.hidden;
  if(v){const els=v.children;vizT+=0.06;
    for(let i=0;i<els.length;i++){
      const base=active?(0.35+0.3*Math.sin(vizT*1.7+i*0.55)+0.25*Math.sin(vizT*3.1+i*1.3)+Math.random()*0.25):0.06;
      vizBars[i]=(vizBars[i]||0.06)*0.6+Math.max(0.05,Math.min(1,base*(1-Math.abs(i-els.length/2)/(els.length*0.9))))*0.4;
      els[i].style.transform=`scaleY(${vizBars[i].toFixed(3)})`;
    }}
  vizRaf=active?requestAnimationFrame(vizFrame):0;
}

function burst(el,chars,n=14){
  if(!el||!S.particles||S.reduce)return;const r=el.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;
  for(let i=0;i<n;i++){const p=document.createElement('span');p.className='burst';p.textContent=chars[i%chars.length];
    const a=Math.random()*Math.PI*2,d=40+Math.random()*70;
    p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d-20+'px');
    p.style.setProperty('--rot',(Math.random()*120-60)+'deg');p.style.fontSize=(12+Math.random()*12)+'px';

async function toggleLike(s,btn){

  const on=!s.liked;if(on&&btn)burst(btn,['💚','✨','💚','♪']);
  s.liked=on;s.likeCount+=on?1:-1;s.weekLikes=Math.max(0,s.weekLikes+(on?1:-1));
  renderGrid();renderFilters();updatePlayerLike();renderNow();if(state.detailId===s.id)renderDetail();
  try{await API.setLike(s.id,on);toast(on?'좋아요 표시한 곡에 추가했어요':'좋아요를 취소했어요')}
  catch(e){toast(e.message,true);await refresh()}finally{likeBusy.delete(s.id)}
}

/* 오픈 이펙트: 별이 반짝이고 LP가 돌며 RE87 로고가 나타나요 */
function runIntro(){
  const intro=$('#intro');const title=$('#introTitle');
  {const w=$('#introWave');w.innerHTML=Array.from({length:31},(_,i)=>{const c=Math.abs(i-15)/15;const h=Math.round(18+(1-c*c)*68*(0.6+Math.random()*0.4));return `<i style="--h:${h}px;animation-delay:${(0.2+Math.abs(i-15)*0.03).toFixed(2)}s,${(0.55+Math.random()*0.5).toFixed(2)}s;animation-duration:.35s,${(0.45+Math.random()*0.5).toFixed(2)}s"></i>`}).join('')}
  title.innerHTML=`<span style="animation-delay:1.1s">R</span><span style="animation-delay:1.19s">E</span><span style="animation-delay:1.28s"><em id="introNum">00</em></span>`;
  {const t1=performance.now()+1500,dur=1300;const ease=x=>1-Math.pow(1-x,3);
   const step=now=>{const k=Math.max(0,Math.min(1,(now-t1)/dur));const v=Math.round(ease(k)*87);const n=$('#introNum'),pc=$('#introPct');
     if(n)n.textContent=String(v).padStart(2,'0');if(pc)pc.textContent=v+'%';if(k<1&&n)requestAnimationFrame(step)};requestAnimationFrame(step)}
  const cv=$('#introStars'),ctx=cv.getContext('2d');let W,H,stars,raf,t0=performance.now();
  const size=()=>{W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
    stars=Array.from({length:220},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.4+.3)*devicePixelRatio,p:Math.random()*6.28,s:Math.random()*2+1,g:Math.random()<.35}))};
  size();addEventListener('resize',size);
  const draw=now=>{const t=(now-t0)/1000;ctx.clearRect(0,0,W,H);
    for(const s of stars){const dx=(s.x-W/2),dy=(s.y-H/2);const k=1+Math.min(t,3)*.04*s.s;
      ctx.globalAlpha=Math.min(1,t*1.5)*(.35+.65*Math.abs(Math.sin(s.p+t*s.s)));ctx.fillStyle=s.g?'#1ed760':'#e9fff0';
      ctx.beginPath();ctx.arc(W/2+dx*k,H/2+dy*k,s.r,0,6.28);ctx.fill()}
    raf=requestAnimationFrame(draw)};
  raf=requestAnimationFrame(draw);
  let done=false;
  const end=()=>{if(done)return;done=true;removeEventListener('keydown',end);intro.classList.add('out');setTimeout(()=>{cancelAnimationFrame(raf);removeEventListener('resize',size);intro.remove()},800)};
  intro.addEventListener('click',end);addEventListener('keydown',end);
  setTimeout(end,3700);
}

(async()=>{
  document.title=CONFIG.APP_NAME;
  applySettings();if(S.intro&&!S.reduce)runIntro();else $('#intro').remove();renderSkeleton();applyRight();renderNow();
  const online=CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY;
  if(online&&!window.supabase){toast('Supabase를 불러오지 못했어요 (인터넷 연결 확인). 체험 모드로 열어요',true)}

  await refresh();if(S.startView!=='all'){state.view=S.startView;renderFilters();renderGrid()}pushHist();openFromHash();
  // 온라인 모드: 30초마다 새 글 확인
  if(API.mode==='online'){setInterval(()=>{if(document.visibilityState==='visible'&&!$$('.modal:not(.hidden):not(#detailModal)').length)refresh(false)},30000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(false)})}
})();
